      subject: {type: string, must: [create, update, filter, search]}
      content: {type: string, must: [create, update]}
      date: {type: date, must: [create, update, filter]}
      time: {type: string, must: [create, update]}
      internalDesignation: {type: string, must: [create, update]}
      editor: {type: string, must: [create, update]}
      project: {type: reference, ref: Project, must: [create, update, filter]}
      sender: {type: embedded}
      sender.partner: {type: reference, ref: Customer, must: [create, update, filter]}
