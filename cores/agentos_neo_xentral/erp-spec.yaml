      costCenter: {type: string, must: [create, update]}
      references: {type: embedded}
      references.customerOrderNumber:
        type: string
        must: [create, update, filter, search]
        gaps:
          - ops: [create]
            contested: [create]
            reason: >-
              The customer's PO number on the invoice (B2B) — read-only upstream today; must be
              settable and correctable.
          - ops: [search]
            contested: [create]
            reason: >-
              Support and accounting find invoices by the customer's PO number.
      references.debtorAccountNumber:
        type: string
        must: [create, update]
        gaps:
          - ops: [create, update]
            reason: >-
              Deviating debtor account for the FiBu/DATEV export — settable when it differs from
              the customer default.
      dates: {type: embedded}
      dates.issued: {type: date, must: [create, update, filter, sort]}
      dates.serviceDate: {type: date, must: [create, update]}
      dates.servicePeriod: {type: string}
      taxation: {type: select, must: [create, update]}
      billingAddress: {type: embedded}
      billingAddress.name: {type: string, must: [create, update]}
      billingAddress.street: {type: string, must: [create, update]}
      billingAddress.zip: {type: string, must: [create, update]}
      billingAddress.city: {type: string, must: [create, update]}
      billingAddress.country: {type: string, must: [create, update]}
      billingAddress.email:
        type: string
        must: [create, update, search]
        gaps:
          - ops: [search]
            reason: >-
              Email search — standard use-case for finding a customer's invoices.
      billingAddress.phone: {type: string, must: [create, update]}
      billingAddress.vatId: {type: string, must: [create, update]}
      items: {type: collection}
