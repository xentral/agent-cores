              upstream today.
      settlement.status: {type: select}
      settlement.payments: {type: collection}
      settlement.payments.id: {type: string}
      settlement.payments.number: {type: string}
      texts: {type: embedded}
      texts.intro: {type: string, must: [create, update]}
      texts.outro: {type: string, must: [create, update]}
      note: {type: string, must: [create, update]}
      documents: {type: embedded}
      documents.salesInvoice: {type: reference, ref: SalesInvoice}
      documents.return: {type: reference, ref: Return}
      tags: {type: tag, must: [create, update, filter]}
      writeProtection: {type: boolean, must: [filter]}
      customFields:
        type: embedded
        must: [create, update]
        gaps:
          - ops: [create, update]
            reason: >-
              Custom field values on the credit note — today only readable via include, not
              writable via API.
      createdAt: {type: datetime, must: [filter, sort]}
      updatedAt: {type: datetime, must: [filter, sort]}
      items.totals.tax:
        missing: true
        must: [read]
