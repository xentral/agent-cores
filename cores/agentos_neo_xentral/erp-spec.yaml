      - field: purchasing.deliveryDays
        ops: [create, update]
        reason: >-
          Standard supplier lead time in days — feeds replenishment planning.
      - field: defaults.paymentTerms.dueDays
        ops: [create, update]
        reason: >-
          Default supplier payment term — drives liability due dates.
      - field: finance.creditorAccountNumber
        ops: [update]
        reason: >-
          The creditor account for the FiBu/DATEV export — settable per supplier.
      - field: finance.openAmount
        ops: [read]
        reason: >-
          Aggregated open liabilities per supplier are computed nowhere in the API — must be
          derived/served.
      - field: customFields
        ops: [create, update]
        reason: >-
          Custom field values on the supplier — today only readable, not writable via API.
      - field: status
        ops: [read, update]
        reason: >-
          Active/archived state is not exposed via v3 suppliers — needed for honest archiving
          (plan §6.1).
      - field: parent
        ops: [read, update]
        reason: >-
          B2B hierarchy (branch → HQ) is not exposed via the public API (plan §6.1 parent).
      - field: billTo
        ops: [read, update]
        reason: >-
          Central billing (Zentralregulierung — invoice to association/HQ) is not exposed (plan
          §6.1 billTo).
      - field: channels
        ops: [read]
        reason: >-
          Per-channel external ids (channel links) are not exposed via the public API.
      - field: defaults.shippingMethod
        ops: [read, update]
        reason: >-
          The default shipping method is not surfaced by the v3 partner read.
      - field: defaults.priceList
        ops: [read, update]
        reason: >-
          The assigned price list is not surfaced by the v3 partner read.
      - field: defaults.partialShipping
        ops: [read, update]
        reason: >-
          The partial-shipping preference is not surfaced by the v3 partner read.
  Product:
    label: Product
    reviewed: null
    operations: [list, read, create, update, delete]
    statuses:
      status: [active, inactive, archived]
    requiredForCreate: [name]
    filterable: [number, status, name, identifiers.ean]
    fields: [prices.sale]
    can:
      activate: {evidence: null}
      deactivate: {evidence: null}
    cannot:
      adjustStock: >-
        No public product-level stock adjustment; v1 storageLocations/setTotalStock works per
        location but is not composed.
      duplicate: >-
        No duplicate endpoint upstream.
      recalculatePurchasePrice: >-
        Price recalculation has no public trigger.
      syncToChannel: >-
        v1 products/{id}/salesChannels assigns a channel; a true sync push is not exposed.
      mergeInto: >-
        Duplicate merge is a UI-only feature — no API.
      archive: >-
        v2 products rejects isDeleted writes (400).
    fieldGaps:
      - field: kind
        ops: [create, update]
        reason: >-
          The consolidated product kind (ADR-011) should be settable directly instead of
          juggling isServiceProduct/isFee/isShippingCostsProduct booleans — the v2 create body
          only exposes isShippingCostsProduct, so service/digital cannot be expressed.
      - field: prices.sale
        ops: [read]
        reason: >-
          WRITE works — the sale price is composed as a separate salesPrices write on
          create/update. READ is still blue: the v3 read model does not carry the sale price
          (needs the salesPrices include parsed), so a written price is not read back.
      - field: tax.profile
        ops: [create, update]
        reason: >-
          The 16-account tax matrix consolidated into a referenceable taxProfile (ADR-011) —
          today only the raw taxAccounts embed exists, not a clean reference.
      - field: logistics.packagingUnits
        ops: [create, read, update]
        reason: >-
          Packaging units (VPE) need the packagingUnits include parsed — not yet mapped.
      - field: stock.incoming
        ops: [read]
        reason: >-
          Inbound quantity (ordered but not yet received) is the one stock figure Xentral does
          not compute: /products/{id}/stocks returns physical, sellable, reserved, correction,
          pseudo, openSalesOrders, calculated and producible — all mapped — but nothing inbound.
          The per-warehouse split the same call carries is answered by StockLevel
          (filter[product], narrowed by warehouse), so it is not duplicated onto the product.
      - field: suppliers
        ops: [create, update]
        reason: >-
          The default supplier IS writable (mapped to v2 standardSupplier); multi-supplier
          sourcing (several suppliers with per-supplier price/number) needs a suppliers
          include/relation not yet mapped, plus a write path.
      - field: tags
        ops: [create, update]
        reason: >-
          Tagging products (assortment curation, campaigns) — product writes now go through v2,
          but the v2 tags shape ({id,key,name,color}) is not yet mapped/verified, so tag writes
          stay blue.
  PriceList:
    label: Price list
    reviewed: null
    operations: [list, read, create, update, delete]
    requiredForCreate: [product]
    filterable: [product]
    cannot:
      duplicate: >-
        A duplicate-with-validFrom composer is not built (create a new entry instead).
      bulkAdjust: >-
        A percentage bulk adjustment has no endpoint and is not composed.
      activate: >-
        v1 salesPrices carries no activation state write.
      deactivate: >-
        v1 salesPrices carries no activation state write.
    fieldGaps:
      - field: entries
        ops: [read]
        reason: >-
          v1 salesPrices exposes flat price rows (this entity is one row); the grouped priceList
          with a tier array needs a composer (ADR-012). Write each tier as its own entry
          (create/update/delete are live via v3/v1 salesPrices).
  PurchasePrice:
    label: Purchase price
    reviewed: null
    operations: [list, read, create, update, delete]
    requiredForCreate: [product, supplier]
  StorageLocation:
    label: Storage location
    reviewed: null
    operations: [list, read, create, update, delete]
    statuses:
      status: [active, blocked]
    requiredForCreate: [name, warehouse]
    can:
      putaway: {evidence: reachable, params: [product, quantity]}
      stockRemoval: {evidence: reachable, params: [product, quantity]}
      stockTransfer: {evidence: reachable, params: [product, quantity, target]}
      inventoryCount: {evidence: reachable, params: [product, quantity]}
      stockAdjustment: {evidence: reachable, params: [product, quantity, reason]}
    cannot:
      block: >-
        v1 storageLocations exposes no block/release state write.
      release: >-
        v1 storageLocations exposes no block/release state write.
      printLabel: >-
        Storage-location labels have no public endpoint.
    fieldGaps:
      - field: contents.reserved
        ops: [read]
        reason: >-
          Location contents are composed from the StockLevel projection now; the reserved
          portion per location stays unavailable — upstream reports reservations only as a
          product total.
      - field: description
        ops: [create, update]
        reason: >-
          Upstream returns the bin description but rejects it on create and update ("The
          attribute description is not allowed.") — the field is read-only for every API
          generation we have. Measured on mvp 2026-08-02.
      - field: locationType
        ops: [read]
        reason: >-
          v1 accepts a `locationType` on write with 204 but never returns it on any read, so a
          value written there cannot be verified or shown. Not modelled until upstream reads it
          back. Measured on mvp 2026-08-02.
  StockLevel:
    label: Stock level
    reviewed: null
    operations: [list, read]
    filterable: [product, warehouse, storageLocation]
    fields: [available, reserved]
    fieldGaps:
      - field: reserved
        ops: [read]
        reason: >-
          No per-location reservation is exposed upstream; /v1/products/{id}/stocks reports
          reserved only as a product TOTAL. The projection reports quantity and leaves
          reserved/available blank rather than spreading a total over locations.
      - field: available
        ops: [read]
        reason: >-
          Same gap as reserved: available = quantity - reserved is only derivable per product,
          not per storage location.
      - field: batch
        ops: [read, list]
        reason: >-
          The batch split exists on the v2 items path (qualityControlAttributes) but not on
          /v1/products/{id}/storageLocations. Emitting batch rows on one anchor only would make
          the grain depend on the filter, so the projection stays product × storage location. A
          unified GET /v3/stockLevels is the clean ask (docs/05 #18).
      - field: quantity
        ops: [list]
        reason: >-
          The list needs an anchor filter (product or storageLocation): upstream has no global
          stock collection, so an unanchored query would mean fanning out over every product of
          the tenant.
  Batch:
    label: Batch
    reviewed: null
    operations: []
    cannot:
      traceReport: >-
        Batch/serial trace has no public API (05) — the report comes with it.
      block: >-
        The batch API itself is missing upstream (the entity is blocked).
      release: >-
        The batch API itself is missing upstream (the entity is blocked).
    fieldGaps:
      - field: id
        ops: [list, read]
        reason: >-
          Batches exist only as read-only v3 Product includes — no batch resource, no list, no
          detail (docs/05 #4). GET /v3/batches is the ask.
      - field: trace
        ops: [read]
        reason: >-
          Batch trace (which goods receipts brought it in, which delivery notes shipped it —
          recall scenario) has no API at all (docs/05 #4).
      - field: status
        ops: [update]
        reason: >-
          Blocking/releasing a batch (quality hold) via API — maintenance happens only through
          internal web routes today.
      - field: bestBefore
        ops: [update]
        reason: >-
          Correcting a best-before date via API — internal web routes only today.
  Channel:
    label: Channel
    reviewed: null
    operations: [list, read]
    cannot:
      syncOrders: >-
        The channel API (05 #17) exposes no sync triggers.
      syncStock: >-
        The channel API (05 #17) exposes no sync triggers.
      syncProducts: >-
        The channel API (05 #17) exposes no sync triggers.
      testConnection: >-
        The channel API (05 #17) exposes no connection test.
      pause: >-
        The channel API (05 #17) exposes no state writes.
      resume: >-
        The channel API (05 #17) exposes no state writes.
    fieldGaps:
      - field: sync
        ops: [read]
        reason: >-
          Channel sync-run status (last run, success/failure) is not exposed — needed to monitor
          shop imports (docs/05 #17, still open after the BF salesChannel entity covered the
          list).
      - field: type
        ops: [read, create, update]
        reason: >-
          The channel type (shop/marketplace/direct/pos) is not on the BF salesChannel record —
          needed for channel-specific routing.
      - field: active
        ops: [read, create, update]
        reason: >-
          Enable/disable state is not on the BF salesChannel record.
      - field: name
        ops: [create, update]
        reason: >-
          REVISED (docs/05 #17): BF salesChannel has CRUD — our facade write-mapping + live
          verification is pending.
      - field: platform
        ops: [read]
        reason: >-
          The platform kind (shopify/amazon/…) is not exposed — the BF salesChannel entity
          carries only a name (05 #17).
      - field: defaults
        ops: [read]
        reason: >-
          Channel defaults (price list, warehouse) are not exposed (05 #17).
  CustomerGroup:
    label: Customer group
    reviewed: null
    operations: [list, read, create, update, delete]
    requiredForCreate: [name]
  SerialNumber:
    label: Serial number
    reviewed: null
    operations: []
    cannot:
      traceReport: >-
        Batch/serial trace has no public API (05) — the report comes with it.
      block: >-
        The serial-number API itself is missing upstream (the entity is blocked).
      release: >-
        The serial-number API itself is missing upstream (the entity is blocked).
  Tag:
    label: Tag
    reviewed: null
    operations: [list, read]
  Task:
    label: Task
    reviewed: null
    operations: [list, read, create, update, delete]
    statuses:
      status: [open, inProgress, completed]
      priority: [low, normal, high]
    requiredForCreate: [title]
    fieldGaps:
      - field: assignee
        ops: [create, update]
        reason: >-
          The one thing that would make a task a work item. `assignee` is readOnly upstream: a
          create or update carrying it answers 2xx and leaves the field null. Measured on mvp
          2026-08-02.
      - field: timeline
        ops: [read]
        reason: >-
          The task's comment thread. Declared `readWrite` with a full sub-node and returned by
          NO read — not the list, not the single read, and no include/expand parameter produces
          it. Not modelled until it reads back.
      - field: dates.completed
        ops: [update]
        reason: >-
          Completing a task through the API does not stamp its completion date: `status:
          completed` persists, `completionDate` stays null.

