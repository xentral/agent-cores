# The ERP specification of this core — reviewed by a domain expert.
#
# READ THIS FIRST: the direction of proof runs from here TO the code. This file states
# what the ERP must be able to do and to record; CI replays every statement against the
# core's own metadata and against the live-probe results in `verified.json`
# (tests/test_core_playbooks.py). When the two disagree, the default reading is that the
# CORE is wrong — not that this file needs adjusting to match it.
#
# It is deliberately NOT generated. It is checked against the very metadata a generator
# would derive it from, so generating it would turn every rule into a tautology that can
# never fail again. A specification derived from the implementation also cannot state
# what is still missing, which is the only reason a domain expert would read it.
#
# This file SHIPS: the core loads it at runtime and renders each recorded gap where it
# applies — on the action, or on the field — so a builder reads "not possible, and here
# is why" at the point of use rather than mere absence. Absence is indistinguishable
# from "nobody looked".
#
# Layout
# ------
# Grouped `category → entity → everything about that entity`, so one block answers
# "what can this system do with an order". The categories are the core's OWN
# `manifest.category` — the same value `describe` ships — not a taxonomy this file
# invents; a rule enforces that every entity sits under the one its adapter declares.
# Inside a category, entities follow the process chain (customer → quote → order →
# delivery → invoice → return → credit note, then purchasing, then master data) and
# then alphabetically, matching the order `review.xlsx` reads in.
#
# Per entity
# ----------
# label               what the entity is called, mirrored from the core (checked)
# reviewed            sign-off ledger: the date a domain expert went through this
#                     entity, or null. NOT a gate — an unreviewed core is a normal
#                     state, and gating it would only get the ledger filled to quiet CI
# operations          the CRUD surface. Stated for every entity: read-only vs writable
#                     is a business decision, and left as a sample this section reads
#                     as "these are the interesting ones" when it means "nobody wrote
#                     down the rest"
# statuses            the lifecycle vocabulary of each status-shaped field
# requiredForCreate   what a create must carry
# filterable          what must be queryable
# notFilterable       documented traps: the field exists but cannot be queried
# fields              field paths the reviewer decided must exist. Deliberately NOT an
#                     inventory of the model — a sample, and reading it as a complete
#                     statement is the mistake this note exists to prevent
# can                 the capability works, with the verdict a live run returned:
#                     `pass` (effect read back — proof), `executed` (something changed,
#                     nobody looked), `reachable` (the route exists and refused our
#                     probe — NO claim either way), `null` (never tested). `params`
#                     names the required command parameters. Checked against
#                     verified.json in both directions, so the number of unproven
#                     capabilities cannot drift upward quietly
# cannot              the capability is needed but the upstream cannot do it, mapped to
#                     the measured reason. The ADAPTER still classifies it (`wish=True`);
#                     this file supplies the text. If this file decided both, the two
#                     rules that matter most — a required capability must not be a gap,
#                     a recorded gap must still be one — would compare it against itself
# fieldGaps           field × operation the merchant needs and the API cannot serve,
#                     with the business reason. An entry retires itself once a live
#                     probe proves the facet; a STALE one is the dangerous kind, because
#                     a gap outranks a real capability wherever it is shown
#
# Empty sections are omitted rather than written as {} — absence and emptiness do not
# differ here, and the completeness rules derive "this entity has no capabilities" from
# the core. `reviewed` is the exception and is always written: a missing entry in a
# sign-off ledger cannot be told apart from a forgotten one.
#
# Was `capabilities.spec.yaml` + `field-gaps.yaml`, organised by section. Finding out
# what the system could do with an order meant reading eleven places in two files, and
# three sections carried the entity as a string prefix (`"SalesOrder.status"`).

documents:
  Quote:
    label: Quote
    reviewed: null
    operations: [list, read, create, update, delete]
    fields:
      object: {type: string}
      id: {type: string}
      number:
        type: string
        must: [create, filter, sort, search]
        gaps:
          - ops: [create]
            reason: >-
              Carrying a quote number over from another system. The v3 create does not declare
              documentNumber for this document type and ignores a supplied value without an
              error, so the core refuses it instead. salesOrder, invoice and creditNote do
              accept one.
      status: {type: select, must: [filter], options: [draft, sent, accepted, declined, expired, cancelled]}
      customer:
        type: reference
        ref: Customer
        required: true
        must: [create, update, filter]
        gaps:
          - ops: [update]
            reason: >-
              Reassign the quote's partner after creation — v3 accepts it only on create.
      channel: {type: reference, ref: Channel}
      project: {type: reference, ref: Project, must: [create, update]}
      costCenter: {type: string, must: [create, update]}
      references: {type: embedded}
      references.customerInquiryNumber:
        type: string
        must: [create, update, filter]
        gaps:
          - ops: [create, update]
            reason: >-
              The customer's inquiry / RFQ number — B2B standard; read-only upstream today.
      dates: {type: embedded}
      dates.issued: {type: date, must: [create, update, filter, sort]}
      dates.validUntil:
        type: date
        must: [create, update, filter]
        gaps:
          - ops: [create, update]
            reason: >-
              Offer validity date — drives auto-expiry and follow-up; must be settable per
              quote.
      dates.expectedOrderDate:
        type: date
        must: [create, update, filter]
        gaps:
          - ops: [create, update]
            reason: >-
              Expected order date feeds the sales forecast — settable per quote.
      dates.requestedDelivery:
        type: date
        must: [create, update, filter]
        gaps:
          - ops: [create, update]
            reason: >-
              Desired delivery date on the quote — not writable upstream today.
      billingAddress: {type: embedded}
      billingAddress.name: {type: string, must: [create, update]}
      billingAddress.street: {type: string, must: [create, update]}
      billingAddress.zip: {type: string, must: [create, update]}
      billingAddress.city: {type: string, must: [create, update]}
      billingAddress.country: {type: string, must: [create, update]}
      billingAddress.email: {type: string, must: [create, update]}
      billingAddress.phone: {type: string, must: [create, update]}
      billingAddress.vatId: {type: string, must: [create, update]}
      shippingAddress: {type: embedded}
      shippingAddress.name: {type: string, must: [create, update]}
      shippingAddress.street: {type: string, must: [create, update]}
      shippingAddress.zip: {type: string, must: [create, update]}
      shippingAddress.city: {type: string, must: [create, update]}
      shippingAddress.country: {type: string, must: [create, update]}
      shippingAddress.email: {type: string, must: [create, update]}
      shippingAddress.phone: {type: string, must: [create, update]}
      shippingAddress.vatId: {type: string}
      items: {type: collection}
      items.object: {type: string}
      items.id: {type: string}
      items.position: {type: integer}
      items.product: {type: reference, ref: Product, required: true, must: [create, filter]}
      items.description: {type: string, must: [create, update]}
      items.quantity: {type: embedded, required: true, must: [create, update]}
      items.quantity.value: {type: decimal}
      items.quantity.unit: {type: string}
      items.unitPrice: {type: embedded, must: [create, update]}
      items.unitPrice.amount: {type: decimal}
      items.unitPrice.currency: {type: string}
      items.priceSource: {type: string}
      items.discountPercent: {type: decimal, must: [create, update]}
      items.purchasePrice: {type: embedded, must: [create, update]}
      items.purchasePrice.amount: {type: decimal}
      items.purchasePrice.currency: {type: string}
      items.contributionMargin: {type: decimal}
      items.totals: {type: embedded}
      items.totals.net: {type: string}
      items.totals.gross: {type: string}
      items.taxRate:
        type: string
        must: [create, update]
        gaps:
          - ops: [create, update]
            reason: >-
              Deviating tax rate per position. Upstream derives the line tax from the product's
              tax class and the customer's tax rule; v3 accepts taxRate on a line item, answers
              2xx and keeps its own value — measured on mvp 2026-08-01 (sent "reduced", read
              back "standard", on create and on update alike). Needs a real write path upstream.
      items.isOptional:
        type: boolean
        must: [create, update]
        gaps:
          - ops: [create, update]
            reason: >-
              Optional line items (not counted in totals) are a core quoting feature — not
              settable upstream today.
      currency: {type: string, must: [create, update]}
      totals: {type: embedded}
      totals.currency: {type: string}
      totals.net: {type: string}
      totals.gross: {type: string}
      payment: {type: embedded}
      payment.method:
        type: reference
        ref: PaymentMethod
        must: [create, update]
        gaps:
          - ops: [create, update]
            reason: >-
              Payment method proposed on the quote — frequently set per offer.
      payment.terms: {type: embedded}
      payment.terms.dueDays:
        type: integer
        must: [create, update]
        gaps:
          - ops: [create, update]
            reason: >-
              Payment term proposed on the quote.
      payment.terms.discountPercent: {type: decimal}
      payment.terms.discountDays: {type: integer}
      shipping: {type: embedded}
      shipping.method:
        type: reference
        ref: ShippingMethod
        must: [create, update]
        gaps:
          - ops: [create, update]
            contested: [create, update]
            reason: >-
              Shipping method proposed on the quote.
      texts: {type: embedded}
      texts.intro: {type: string, must: [create, update]}
      texts.outro: {type: string, must: [create, update]}
      note: {type: string, must: [create, update]}
      documents: {type: embedded}
      documents.salesOrders: {type: collection}
      documents.salesOrders.id: {type: string}
      documents.salesOrders.number: {type: string}
      tags: {type: tag, must: [create, update, filter]}
      writeProtection: {type: boolean, must: [filter]}
      customFields:
        type: embedded
        must: [create, update]
        gaps:
          - ops: [create, update]
            reason: >-
              Custom field values on the quote — today only readable via include, not writable
              via API.
      createdAt: {type: datetime, must: [filter, sort]}
      updatedAt: {type: datetime, must: [filter, sort]}
      items.totals.tax:
        missing: true
        must: [read]
        gaps:
          - ops: [read]
            reason: >-
              Tax amount per line. v3 states only taxRate and effectiveTaxRate on a line — no
              money figure — so the tax a position carries cannot be read. The core will not
              derive it from gross minus net: that is a number Xentral never stated, and
              line-level rounding against the legacy PDF (projekt.preisberechnung) is still an
              open decision, so a derived value could silently disagree with the printed
              document. Per-rate tax exists on the document totals; the line needs its own.
    can:
      send: {evidence: reachable}
      downloadPdf: {evidence: pass}
      addTag: {evidence: pass, params: [title]}
      removeTag: {evidence: pass, params: [title]}
      release: {evidence: reachable}
      cancel: {evidence: reachable}
      setWriteProtection: {evidence: null}
      removeWriteProtection: {evidence: null}
    cannot:
      convertToSalesOrder: >-
        No conversion endpoint we can reach. v3 has createFromSalesOrder and
        createFromDeliveryNote for invoices and returns, but no createFromOffer for sales
        orders, and POST /v3/salesOrders cannot reference a quote (the relation is read-only).
        v1 salesOrders/import is a raw import, not a conversion. The logic exists —
        Erpapi::WeiterfuehrenAngebotZuAuftrag copies the document and sets the quote to
        commissioned — and is exposed once, as the legacy XML API /api/v1/AngebotZuAuftrag. That
        one is digest-authenticated, hangs on a legacy permission and already sits behind a
        killswitch, so it is not usable from a bearer-token core.
      duplicate: >-
        No duplicate endpoint in any API generation — no v3 action, nothing in v1/v2, nothing in
        the legacy XML API. erpAPI::CopyAngebot() does the work behind the UI only. The same
        function exists for orders, invoices and delivery notes, so one uniform
        actions/duplicate would serve every document type at once.
      accept: >-
        No upstream endpoint. v3 offers has exactly release, cancel, send, logActivity,
        setWriteProtection and removeWriteProtection; UpdateOfferData carries no status, and
        offers do not exist in v1/v2 at all. The transition happens only in the UI. Worth
        settling first: the status 'accepted' (angenommen) is written by no code path and occurs
        in no tenant — the state the ERP really keeps is 'commissioned' (beauftragt), reached as
        a side effect of converting the quote into a sales order.
      decline: >-
        No upstream endpoint. Declining sets angebot.status='abgelehnt' and closes open
        follow-ups — two SQL updates inside the legacy page controller, with no service class,
        no API route and no event. The legacy XML API cannot reach it either: ApiBelegEdit
        whitelists the status values and 'abgelehnt' is not among them.
  SalesOrder:
    label: Sales order
    reviewed: null
    operations: [list, read, create, update, delete]
    fields:
      object: {type: string}
      id: {type: string}
      number:
        type: string
        must: [create, update, filter, sort, search]
        gaps:
          - ops: [update]
            reason: >-
              Correcting a sales order number after the fact. The v3 create accepts one, but
              PATCH has no slot for it — a number carried over from another system must be right
              the first time.
      status: {type: select, must: [filter], options: [draft, confirmed, fulfilled, closed, cancelled]}
      customer:
        type: reference
        ref: Customer
        required: true
        must: [create, update, filter]
        gaps:
          - ops: [update]
            reason: >-
              Reassign the order to the correct customer after creation — v3 accepts the partner
              only on create today.
      channel: {type: reference, ref: Channel, must: [create, update]}
      project: {type: reference, ref: Project, must: [create, update]}
      costCenter: {type: string, must: [create, update]}
      references: {type: embedded}
      references.customerOrderNumber:
        type: string
        must: [create, update, filter, search]
        gaps:
          - ops: [create]
            contested: [create]
            reason: >-
              The customer's own order / PO number (B2B standard field). Read-only upstream
              today; a clerk must be able to set and correct it.
          - ops: [search]
            contested: [create]
            reason: >-
              On the phone the customer quotes their PO number, not the ERP number — the
              full-text search must reach it.
      references.externalId:
        type: string
        must: [create, update, filter, search]
        gaps:
          - ops: [search]
            reason: >-
              Automated reconciliation matches by the external id.
      references.externalNumber:
        type: string
        must: [create, update, filter, search]
        gaps:
          - ops: [search]
            reason: >-
              Support finds shop orders by the SHOP number the customer has.
      references.paymentTransactionId: {type: string}
      dates: {type: embedded}
      dates.issued: {type: date, must: [create, update, filter, sort]}
      dates.requestedDelivery:
        type: date
        must: [create, update, filter]
        gaps:
          - ops: [update]
            contested: [update]
            reason: >-
              Desired delivery date — core fulfilment field; one of the first things entered on
              an order. Not writable upstream today.
      dates.earliestFulfillment: {type: date, must: [create, update]}
      dates.reservation: {type: date, must: [create, update]}
      dates.confirmedDelivery: {type: date}
      billingAddress: {type: embedded}
      billingAddress.name: {type: string, must: [create, update]}
      billingAddress.street: {type: string, must: [create, update]}
      billingAddress.zip:
        type: string
        must: [create, update, search]
        gaps:
          - ops: [search]
            reason: >-
              Postal-code search is a standard phone use-case (shop orders).
      billingAddress.city: {type: string, must: [create, update]}
      billingAddress.country: {type: string, must: [create, update]}
      billingAddress.email:
        type: string
        must: [create, update, search]
        gaps:
          - ops: [search]
            reason: >-
              Email search is a standard use-case for shop orders — often the only identifier
              support has.
      billingAddress.phone: {type: string, must: [create, update]}
      billingAddress.vatId: {type: string, must: [create, update]}
      shippingAddress: {type: embedded}
      shippingAddress.name: {type: string, must: [create, update]}
      shippingAddress.street: {type: string, must: [create, update]}
      shippingAddress.zip: {type: string, must: [create, update]}
      shippingAddress.city: {type: string, must: [create, update]}
      shippingAddress.country: {type: string, must: [create, update]}
      shippingAddress.email: {type: string, must: [create, update]}
      shippingAddress.phone: {type: string, must: [create, update]}
      shippingAddress.vatId: {type: string}
      items: {type: collection}
      items.object: {type: string}
      items.id: {type: string}
      items.position: {type: integer}
      items.product: {type: reference, ref: Product, required: true, must: [create, filter]}
      items.description: {type: string, must: [create, update]}
      items.quantity: {type: embedded, required: true, must: [create, update]}
      items.quantity.value: {type: decimal}
      items.quantity.unit: {type: string}
      items.unitPrice: {type: embedded, must: [create, update]}
      items.unitPrice.amount: {type: decimal}
      items.unitPrice.currency: {type: string}
      items.priceSource: {type: string}
      items.purchasePrice: {type: embedded, must: [create, update]}
      items.purchasePrice.amount: {type: decimal}
      items.purchasePrice.currency: {type: string}
      items.contributionMargin: {type: decimal}
      items.discountPercent: {type: decimal, must: [create, update]}
      items.taxRate:
        type: string
        must: [create, update]
        gaps:
          - ops: [create, update]
            reason: >-
              Deviating tax rate per position. Upstream derives the line tax from the product's
              tax class and the customer's tax rule; v3 accepts taxRate on a line item, answers
              2xx and keeps its own value — measured on mvp 2026-08-01 (sent "reduced", read
              back "standard", on create and on update alike). Needs a real write path upstream.
      items.totals: {type: embedded}
      items.totals.net: {type: string}
      items.totals.gross: {type: string}
      items.warehouse: {type: reference, ref: Warehouse}
      items.fulfillment: {type: embedded}
      items.fulfillment.shipped: {type: integer}
      items.fulfillment.invoiced: {type: integer}
      items.fulfillment.returned: {type: integer}
      items.availability: {type: embedded}
      items.availability.stockManaged: {type: boolean}
      items.availability.onHand: {type: decimal}
      items.availability.deliverable: {type: decimal}
      currency: {type: string, must: [create, update]}
      totals: {type: embedded}
      totals.currency: {type: string}
      totals.net: {type: string}
      totals.gross: {type: string}
      totals.taxes: {type: collection}
      totals.taxes.rate: {type: string}
      totals.taxes.percent: {type: decimal}
      totals.taxes.base: {type: string}
      totals.taxes.amount: {type: string}
      payment: {type: embedded}
      payment.method: {type: reference, ref: PaymentMethod, must: [create, update]}
      payment.terms: {type: embedded}
      payment.terms.dueDays: {type: integer, must: [create, update]}
      payment.terms.discountPercent: {type: decimal, must: [create, update]}
      payment.terms.discountDays: {type: integer, must: [create, update]}
      payment.status: {type: select}
      shipping: {type: embedded}
      shipping.method:
        type: reference
        ref: ShippingMethod
        must: [create, update]
        gaps:
          - ops: [create, update]
            contested: [create, update]
            reason: >-
              Carrier / shipping method — core to fulfilment; must be selectable per order.
      shipping.status: {type: select}
      shipping.cost: {type: embedded}
      shipping.cost.amount: {type: string}
      shipping.cost.currency: {type: string}
      fulfillmentPolicy: {type: embedded}
      fulfillmentPolicy.auto: {type: boolean, must: [create, update]}
      fulfillmentPolicy.priority: {type: select, must: [create, update]}
      fulfillmentPolicy.partialShipping:
        type: select
        must: [create, update]
        gaps:
          - ops: [create, update]
            reason: >-
              Partial-shipping policy has no upstream slot — the read reports a hardcoded
              "allowed". Needs a real v3 field before it can be written or trusted.
      holds: {type: collection}
      holds.type: {type: string}
      holds.state: {type: string}
      trafficLights: {type: collection}
      trafficLights.id: {type: string}
      trafficLights.state: {type: string}
      texts: {type: embedded}
      texts.intro: {type: string, must: [create, update]}
      texts.outro: {type: string, must: [create, update]}
      note: {type: string, must: [create, update]}
      documents: {type: embedded}
      documents.quote: {type: reference, ref: Quote}
      documents.deliveryNotes: {type: collection}
      documents.deliveryNotes.id: {type: string}
      documents.deliveryNotes.number: {type: string}
      documents.salesInvoices: {type: collection}
      documents.salesInvoices.id: {type: string}
      documents.salesInvoices.number: {type: string}
      tags: {type: tag, must: [create, update, filter]}
      writeProtection: {type: boolean, must: [filter]}
      discounts:
        type: collection
        must: [read]
        gaps:
          - ops: [read]
            reason: >-
              Header discounts/vouchers (e-commerce) are not exposed by v3 salesOrders — only
              line-level discounts exist.
      discounts.kind: {type: string}
      discounts.description: {type: string}
      discounts.amount: {type: string}
      customFields:
        type: embedded
        must: [create, update, filter]
        gaps:
          - ops: [create, update]
            reason: >-
              Custom field values carry company-specific data — today only readable via include,
              not writable via API (all documents).
          - ops: [filter]
            reason: >-
              Companies segment and find orders by their own custom-field values.
      createdAt: {type: datetime, must: [filter, sort]}
      updatedAt: {type: datetime, must: [filter, sort]}
      items.totals.tax:
        missing: true
        must: [read]
        gaps:
          - ops: [read]
            reason: >-
              Tax amount per line. v3 states only taxRate and effectiveTaxRate on a line — no
              money figure — so the tax a position carries cannot be read. The core will not
              derive it from gross minus net: that is a number Xentral never stated, and
              line-level rounding against the legacy PDF (projekt.preisberechnung) is still an
              open decision, so a derived value could silently disagree with the printed
              document. Per-rate tax exists on the document totals; the line needs its own.
    can:
      createSalesInvoice: {evidence: executed}
      split: {evidence: reachable}
      splitOrder: {evidence: reachable, params: [items]}
      downloadPdf: {evidence: pass}
      sendConfirmation: {evidence: reachable}
      addTag: {evidence: pass, params: [title]}
      removeTag: {evidence: pass, params: [title]}
      release: {evidence: reachable}
      close: {evidence: reachable}
      cancel: {evidence: reachable}
      dispatch: {evidence: reachable}
      setWriteProtection: {evidence: null}
      removeWriteProtection: {evidence: null}
    cannot:
      createDeliveryNote: >-
        v1 dispatch couples delivery-note creation with shipping side-effects; a clean
        createDeliveryNote(items?) needs a dedicated endpoint.
      createPickingRun: >-
        Pick list creation has no public endpoint (05 #12).
      addHold: >-
        Holds map to trafficLights — readable, but there is no public write API.
      releaseHold: >-
        Holds map to trafficLights — readable, but there is no public write API.
      allocateStock: >-
        Stock allocation runs upstream automatically; no manual trigger is exposed.
      duplicate: >-
        No duplicate endpoint upstream.
  DeliveryNote:
    label: Delivery note
    reviewed: null
    operations: [list, read, create, update, delete]
    fields:
      object: {type: string}
      id: {type: string}
      number:
        type: string
        must: [create, filter, sort, search]
        gaps:
          - ops: [create]
            reason: >-
              Carrying a delivery note number over from another system. The v3 create does not
              declare documentNumber for this document type and ignores a supplied value without
              an error, so the core refuses it instead. salesOrder, invoice and creditNote do
              accept one.
      status: {type: select, must: [filter], options: [draft, picking, shipped, delivered, cancelled]}
      customer:
        type: reference
        ref: Customer
        required: true
        must: [create, update, filter]
        gaps:
          - ops: [update]
            reason: >-
              Reassign the delivery note's partner after creation — v3 accepts it only on
              create.
      channel: {type: reference, ref: Channel}
      project: {type: reference, ref: Project, must: [create, update]}
      costCenter: {type: string, must: [create, update]}
      references: {type: embedded}
      references.customerOrderNumber:
        type: string
        must: [create, update, filter, search]
        gaps:
          - ops: [create]
            contested: [create]
            reason: >-
              The customer's PO number on the delivery note (B2B) — read-only upstream today;
              must be settable.
          - ops: [search]
            contested: [create]
            reason: >-
