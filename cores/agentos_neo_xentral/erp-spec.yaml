# What this ERP core IS — per entity, per field.
#
# Purely descriptive. Every line says what the system does today: which operations a
# field supports (`ops`), which of those a live run against a real tenant actually
# demonstrated (`proven`), what a create must carry, the status vocabulary, and which
# capabilities are executable with how strong a proof.
#
# It states no requirements. That is deliberate and it is the change: the file used to
# carry an inherited wish list, and the first spec-driven probe run showed what that was
# worth — four SalesOrder gaps claimed search does not work on fields where it
# demonstrably does, and nothing had ever tried. Requirements now come back one at a
# time, from a human who decided them, and `reviewed` records when that happened.
#
# The recorded reasons why something is NOT possible were not thrown away: they live in
# backlog.yaml, which the core still loads and still renders into `describe`.
#
# `ops` is what the core offers. `proven` is what was measured. The two are not the same
# claim and the difference is the point — a declared flag is not evidence.

