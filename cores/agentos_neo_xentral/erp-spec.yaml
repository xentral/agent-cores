      remind: >-
        No endpoint SENDS a reminder. The dunning LEVEL is writable though - PATCH the invoice's
        dunning.level - so an escalation workflow can record the step even where the mail cannot
        be sent.
      writeOff: >-
        Write-offs have no public endpoint.
      downloadEInvoice: >-
        E-invoice (XRechnung/ZUGFeRD) rendering is not exposed via the public API.
