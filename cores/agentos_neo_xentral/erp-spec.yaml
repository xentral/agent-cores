      unit: {type: string, must: [create, update]}
      category: {type: reference, ref: MerchandiseGroup, must: [create, update]}
      project: {type: reference, ref: Project, must: [update, filter]}
      tags:
        type: tag
        must: [create, update]
        gaps:
          - ops: [create, update]
            reason: >-
              Tagging products (assortment curation, campaigns) — product writes now go through
              v2, but the v2 tags shape ({id,key,name,color}) is not yet mapped/verified, so tag
              writes stay blue.
      identifiers: {type: embedded}
      identifiers.ean: {type: string, must: [create, update, filter, search]}
      identifiers.manufacturerNumber: {type: string, must: [create, update, filter]}
      identifiers.hsCode: {type: string, must: [create, update]}
      identifiers.countryOfOrigin: {type: string, must: [create, update]}
      identifiers.external: {type: collection}
      identifiers.external.channel: {type: reference, ref: Channel}
      identifiers.external.id: {type: string}
      manufacturer: {type: embedded}
      manufacturer.name: {type: string, must: [create, update]}
      manufacturer.website: {type: string, must: [create, update]}
      prices: {type: embedded}
      prices.sale:
        type: embedded
        must: [read]
        gaps:
          - ops: [read]
            reason: >-
              WRITE works — the sale price is composed as a separate salesPrices write on
              create/update. READ is still blue: the v3 read model does not carry the sale price
              (needs the salesPrices include parsed), so a written price is not read back.
      prices.sale.amount: {type: string, must: [create, update]}
      prices.sale.currency: {type: string, must: [create, update]}
      prices.purchase: {type: embedded}
      prices.purchase.amount: {type: string, must: [create, update]}
      prices.purchase.currency: {type: string, must: [create, update]}
      prices.purchase.source: {type: select, must: [create, update]}
      tax: {type: embedded}
      tax.rate: {type: select, must: [create, update]}
      tax.profile:
        type: string
        must: [create, update]
        gaps:
          - ops: [create, update]
            reason: >-
              The 16-account tax matrix consolidated into a referenceable taxProfile (ADR-011) —
              today only the raw taxAccounts embed exists, not a clean reference.
      logistics: {type: embedded}
      logistics.weight: {type: embedded}
      logistics.weight.value: {type: decimal, must: [create, update]}
      logistics.weight.unit: {type: string}
      logistics.netWeight: {type: embedded}
      logistics.netWeight.value: {type: decimal, must: [create, update]}
      logistics.netWeight.unit: {type: string}
      logistics.dimensions: {type: embedded}
      logistics.dimensions.length: {type: decimal, must: [create, update]}
      logistics.dimensions.width: {type: decimal, must: [create, update]}
      logistics.dimensions.height: {type: decimal, must: [create, update]}
      logistics.dimensions.unit: {type: string}
      logistics.minimumOrderQuantity: {type: integer, must: [create, update]}
      logistics.minimumStockQuantity: {type: integer, must: [create, update]}
      logistics.packagingUnits:
        type: collection
        must: [read, create, update]
        gaps:
          - ops: [create, read, update]
            reason: >-
              Packaging units (VPE) need the packagingUnits include parsed — not yet mapped.
      logistics.packagingUnits.unit: {type: string}
      logistics.packagingUnits.quantity: {type: integer}
      tracking: {type: embedded}
      tracking.stock: {type: boolean, must: [create, update]}
      tracking.batches: {type: boolean, must: [create, update]}
      tracking.serialNumbers: {type: select, must: [create, update]}
      tracking.bestBefore: {type: boolean, must: [create, update]}
      stock: {type: embedded}
      stock.available: {type: decimal}
      stock.physical: {type: decimal}
      stock.reserved: {type: decimal}
      stock.openSalesOrders: {type: decimal}
      stock.producible: {type: decimal}
      stock.correction: {type: decimal}
      stock.calculated: {type: decimal}
      stock.pseudo: {type: decimal}
      stock.incoming:
        type: decimal
        must: [read]
        gaps:
          - ops: [read]
            reason: >-
              Inbound quantity (ordered but not yet received) is the one stock figure Xentral
              does not compute: /products/{id}/stocks returns physical, sellable, reserved,
              correction, pseudo, openSalesOrders, calculated and producible — all mapped — but
              nothing inbound. The per-warehouse split the same call carries is answered by
              StockLevel (filter[product], narrowed by warehouse), so it is not duplicated onto
              the product.
      stock.belowMinimum: {type: boolean}
      production: {type: embedded}
      production.mode: {type: select, must: [create, update]}
      production.hasBillOfMaterials: {type: boolean, must: [create, update]}
      documentDefaults: {type: embedded}
      documentDefaults.hidePrice: {type: boolean, must: [create, update]}
      documentDefaults.noticeText: {type: string}
      documentDefaults.requiresCustomerApproval: {type: boolean}
      variant: {type: embedded}
      variant.of: {type: reference, ref: Product, must: [create, update]}
      variant.isMatrix: {type: boolean, must: [create, update, filter]}
      bom: {type: embedded}
      bom.items: {type: collection, must: [create, update]}
      bom.items.product: {type: reference, ref: Product, must: [create, update]}
      bom.items.quantity: {type: decimal, must: [create, update]}
      bom.items.type: {type: select, must: [create, update]}
      bom.items.reference: {type: string, must: [create, update]}
      suppliers:
        type: collection
        must: [create, update]
        gaps:
          - ops: [create, update]
            reason: >-
              The default supplier IS writable (mapped to v2 standardSupplier); multi-supplier
              sourcing (several suppliers with per-supplier price/number) needs a suppliers
              include/relation not yet mapped, plus a write path.
      suppliers.supplier: {type: reference, ref: Supplier, must: [create, update]}
      suppliers.supplierProductNumber: {type: string}
      suppliers.isDefault: {type: boolean, must: [create, update]}
      customFields: {type: collection}
      customFields.number: {type: integer, must: [create, update]}
      customFields.label: {type: string}
      customFields.value: {type: string, must: [create, update]}
      properties: {type: collection}
      properties.property: {type: reference, ref: ProductProperty, must: [create, update]}
      properties.name: {type: string}
      properties.value: {type: string, must: [create, update]}
      properties.unit: {type: string, must: [create, update]}
      createdAt: {type: datetime}
      updatedAt: {type: datetime, must: [filter, sort]}
    can:
      activate: {evidence: null}
      deactivate: {evidence: null}
    cannot:
      adjustStock: >-
        No public product-level stock adjustment; v1 storageLocations/setTotalStock works per
        location but is not composed.
      duplicate: >-
        No duplicate endpoint upstream.
      recalculatePurchasePrice: >-
        Price recalculation has no public trigger.
      syncToChannel: >-
        v1 products/{id}/salesChannels assigns a channel; a true sync push is not exposed.
      mergeInto: >-
        Duplicate merge is a UI-only feature — no API.
      archive: >-
        v2 products rejects isDeleted writes (400).
  PriceList:
    label: Price list
    reviewed: null
    operations: [list, read, create, update, delete]
    fields:
      object: {type: string}
      id: {type: string}
      currency: {type: string}
      entries:
        type: collection
        must: [read]
        gaps:
          - ops: [read]
            reason: >-
              v1 salesPrices exposes flat price rows (this entity is one row); the grouped
              priceList with a tier array needs a composer (ADR-012). Write each tier as its own
              entry (create/update/delete are live via v3/v1 salesPrices).
      entries.product: {type: reference, ref: Product}
      entries.unitPrice: {type: string}
      entries.minQuantity: {type: number}
      product: {type: reference, ref: Product, required: true, must: [create, filter]}
      scope: {type: embedded}
      scope.customer: {type: reference, ref: Customer, must: [create]}
      scope.customerGroup: {type: string, must: [create]}
      minQuantity: {type: decimal, must: [create, update]}
      unitPrice: {type: embedded}
      unitPrice.amount: {type: string, must: [create, update]}
      unitPrice.currency: {type: string, must: [create, update]}
      unitPrice.amountGross: {type: string}
      unitPrice.taxRate: {type: string}
      validFrom: {type: date, must: [create, update]}
      validUntil: {type: date, must: [create, update]}
      remark: {type: string, must: [create, update]}
      createdAt: {type: datetime}
      updatedAt: {type: datetime}
    cannot:
      duplicate: >-
        A duplicate-with-validFrom composer is not built (create a new entry instead).
      bulkAdjust: >-
        A percentage bulk adjustment has no endpoint and is not composed.
      activate: >-
        v1 salesPrices carries no activation state write.
      deactivate: >-
        v1 salesPrices carries no activation state write.
  PurchasePrice:
    label: Purchase price
    reviewed: null
    operations: [list, read, create, update, delete]
    fields:
      object: {type: string}
      id: {type: string}
      product: {type: reference, ref: Product, required: true, must: [create, filter]}
      supplier: {type: reference, ref: Supplier, required: true, must: [create, update, filter]}
      isStandardSupplier: {type: boolean, must: [create, update]}
      supplierDesignation: {type: string, must: [create, update]}
      supplierItemNumber: {type: string, must: [create, update]}
      minQuantity: {type: decimal, must: [create, update]}
      packageAmount: {type: decimal, must: [create, update]}
      unitPrice: {type: embedded}
      unitPrice.amount: {type: string, must: [create, update]}
      unitPrice.currency: {type: string, must: [create, update]}
      validFrom: {type: date, must: [create, update]}
      validUntil: {type: date, must: [create, update]}
      remark: {type: string, must: [create, update]}
      createdAt: {type: datetime}
      updatedAt: {type: datetime}
  StorageLocation:
    label: Storage location
    reviewed: null
    operations: [list, read, create, update, delete]
    fields:
      object: {type: string}
      id: {type: string}
      status: {type: select, options: [active, blocked]}
      name: {type: string, required: true, must: [create, update, filter]}
      warehouse: {type: reference, ref: Warehouse, required: true, must: [create, filter]}
      usage: {type: embedded}
      usage.replenishment: {type: boolean, must: [create, update]}
      usage.consumption: {type: boolean, must: [create, update]}
      usage.blocked: {type: boolean, must: [create, update]}
      usage.production: {type: boolean, must: [create, update]}
      usage.pointOfSale: {type: boolean, must: [create, update]}
      abcCategory: {type: select, must: [create, update]}
      pickingOrder: {type: integer, must: [create, update]}
      dimensions: {type: embedded}
      dimensions.length: {type: decimal, must: [create, update]}
      dimensions.width: {type: decimal, must: [create, update]}
      dimensions.height: {type: decimal, must: [create, update]}
      description:
        type: string
        must: [create, update]
        gaps:
          - ops: [create, update]
            reason: >-
              Upstream returns the bin description but rejects it on create and update ("The
              attribute description is not allowed.") — the field is read-only for every API
              generation we have. Measured on mvp 2026-08-02.
      contents: {type: collection}
      contents.product: {type: reference, ref: Product}
      contents.batch: {type: reference, ref: Batch}
      contents.quantity: {type: embedded}
      contents.quantity.value: {type: decimal}
      contents.quantity.unit: {type: string}
      contents.reserved:
        type: embedded
        must: [read]
        gaps:
          - ops: [read]
            reason: >-
              Location contents are composed from the StockLevel projection now; the reserved
              portion per location stays unavailable — upstream reports reservations only as a
              product total.
      contents.reserved.value: {type: decimal}
      contents.reserved.unit: {type: string}
      createdAt: {type: datetime}
      updatedAt: {type: datetime}
      locationType:
        missing: true
        must: [read]
        gaps:
          - ops: [read]
            reason: >-
              v1 accepts a `locationType` on write with 204 but never returns it on any read, so
              a value written there cannot be verified or shown. Not modelled until upstream
              reads it back. Measured on mvp 2026-08-02.
    can:
      putaway: {evidence: reachable, params: [product, quantity]}
      stockRemoval: {evidence: reachable, params: [product, quantity]}
      stockTransfer: {evidence: reachable, params: [product, quantity, target]}
      inventoryCount: {evidence: reachable, params: [product, quantity]}
      stockAdjustment: {evidence: reachable, params: [product, quantity, reason]}
    cannot:
      block: >-
        v1 storageLocations exposes no block/release state write.
      release: >-
        v1 storageLocations exposes no block/release state write.
      printLabel: >-
        Storage-location labels have no public endpoint.
  StockLevel:
    label: Stock level
    reviewed: null
    operations: [list, read]
    fields:
      object: {type: string}
      id: {type: string}
      product: {type: reference, ref: Product, must: [filter]}
      warehouse: {type: reference, ref: Warehouse, must: [filter]}
      storageLocation: {type: reference, ref: StorageLocation, must: [filter]}
      batch:
        type: reference
        ref: Batch
        must: [read, list]
        gaps:
          - ops: [read, list]
            reason: >-
              The batch split exists on the v2 items path (qualityControlAttributes) but not on
              /v1/products/{id}/storageLocations. Emitting batch rows on one anchor only would
              make the grain depend on the filter, so the projection stays product × storage
              location. A unified GET /v3/stockLevels is the clean ask (docs/05 #18).
      quantity:
        type: embedded
        must: [list]
        gaps:
          - ops: [list]
            reason: >-
              The list needs an anchor filter (product or storageLocation): upstream has no
              global stock collection, so an unanchored query would mean fanning out over every
              product of the tenant.
      quantity.value: {type: decimal}
      quantity.unit: {type: string}
      reserved:
        type: embedded
        must: [read]
        gaps:
          - ops: [read]
            reason: >-
              No per-location reservation is exposed upstream; /v1/products/{id}/stocks reports
              reserved only as a product TOTAL. The projection reports quantity and leaves
              reserved/available blank rather than spreading a total over locations.
      reserved.value: {type: decimal}
      reserved.unit: {type: string}
      available:
        type: embedded
        must: [read]
        gaps:
          - ops: [read]
            reason: >-
              Same gap as reserved: available = quantity - reserved is only derivable per
              product, not per storage location.
      available.value: {type: decimal}
      available.unit: {type: string}
  Batch:
    label: Batch
    reviewed: null
    operations: []
    fields:
      object: {type: string}
      id:
        type: string
        must: [read, list]
        gaps:
          - ops: [list, read]
            reason: >-
              Batches exist only as read-only v3 Product includes — no batch resource, no list,
              no detail (docs/05 #4). GET /v3/batches is the ask.
      number: {type: string, must: [filter, search]}
      product: {type: reference, ref: Product, must: [filter]}
      bestBefore:
        type: date
        must: [update, filter, sort]
        gaps:
          - ops: [update]
            reason: >-
              Correcting a best-before date via API — internal web routes only today.
      status:
        type: select
        must: [update, filter]
        gaps:
          - ops: [update]
            reason: >-
              Blocking/releasing a batch (quality hold) via API — maintenance happens only
              through internal web routes today.
      stock: {type: embedded}
      stock.available: {type: decimal}
      stock.reserved: {type: decimal}
      trace:
        type: embedded
        must: [read]
        gaps:
          - ops: [read]
            reason: >-
              Batch trace (which goods receipts brought it in, which delivery notes shipped it —
              recall scenario) has no API at all (docs/05 #4).
      trace.goodsReceipts: {type: collection}
      trace.goodsReceipts.id: {type: string}
      trace.deliveryNotes: {type: collection}
      trace.deliveryNotes.id: {type: string}
    cannot:
      traceReport: >-
        Batch/serial trace has no public API (05) — the report comes with it.
      block: >-
        The batch API itself is missing upstream (the entity is blocked).
      release: >-
        The batch API itself is missing upstream (the entity is blocked).
  Channel:
    label: Channel
    reviewed: null
    operations: [list, read]
    fields:
      object: {type: string}
      id: {type: string}
      platform:
        type: select
        must: [read]
        gaps:
          - ops: [read]
            reason: >-
              The platform kind (shopify/amazon/…) is not exposed — the BF salesChannel entity
              carries only a name (05 #17).
      defaults:
        type: embedded
        must: [read]
        gaps:
          - ops: [read]
            reason: >-
              Channel defaults (price list, warehouse) are not exposed (05 #17).
      defaults.priceList: {type: reference, ref: PriceList}
      defaults.warehouse: {type: reference, ref: Warehouse}
      name:
        type: string
        must: [create, update, filter, search]
        gaps:
          - ops: [create, update]
            reason: >-
              REVISED (docs/05 #17): BF salesChannel has CRUD — our facade write-mapping + live
              verification is pending.
      type:
        type: select
        must: [read, create, update]
        gaps:
          - ops: [read, create, update]
            reason: >-
              The channel type (shop/marketplace/direct/pos) is not on the BF salesChannel
              record — needed for channel-specific routing.
      active:
        type: boolean
        must: [read, create, update]
        gaps:
          - ops: [read, create, update]
            reason: >-
              Enable/disable state is not on the BF salesChannel record.
      sync:
        type: embedded
        must: [read]
        gaps:
          - ops: [read]
            reason: >-
              Channel sync-run status (last run, success/failure) is not exposed — needed to
              monitor shop imports (docs/05 #17, still open after the BF salesChannel entity
              covered the list).
      sync.lastRunAt: {type: datetime}
      sync.status: {type: select}
      createdAt: {type: datetime, must: [sort]}
      updatedAt: {type: datetime, must: [sort]}
    cannot:
      syncOrders: >-
        The channel API (05 #17) exposes no sync triggers.
      syncStock: >-
        The channel API (05 #17) exposes no sync triggers.
      syncProducts: >-
        The channel API (05 #17) exposes no sync triggers.
      testConnection: >-
        The channel API (05 #17) exposes no connection test.
      pause: >-
        The channel API (05 #17) exposes no state writes.
      resume: >-
        The channel API (05 #17) exposes no state writes.
  CustomerGroup:
    label: Customer group
    reviewed: null
    operations: [list, read, create, update, delete]
    fields:
      object: {type: string}
      id: {type: string}
      name: {type: string, required: true, must: [create, update, filter, search]}
      kind: {type: select, must: [create, update, filter]}
      code: {type: string, must: [create, update, filter, search]}
      isActive: {type: boolean, must: [create, update, filter]}
      internalNote: {type: string, must: [create, update]}
      project: {type: reference, ref: Project, must: [create, update]}
      conditions: {type: embedded}
      conditions.baseDiscount: {type: decimal, must: [create, update]}
      conditions.paymentTermDays: {type: integer, must: [create, update]}
      conditions.cashDiscountRate: {type: decimal, must: [create, update]}
      conditions.cashDiscountDays: {type: integer, must: [create, update]}
      conditions.freeShippingFrom: {type: decimal, must: [create, update]}
      conditions.freeShippingActive: {type: boolean, must: [create, update]}
      createdAt: {type: datetime, must: [sort]}
      updatedAt: {type: datetime, must: [sort]}
  SerialNumber:
    label: Serial number
    reviewed: null
    operations: []
    fields:
      object: {type: string}
      id: {type: string}
      number: {type: string, must: [filter, search]}
      product: {type: reference, ref: Product, must: [filter]}
      status: {type: select, must: [filter]}
      customer: {type: reference, ref: Customer, must: [filter]}
      trace: {type: embedded}
      trace.goodsReceipts: {type: collection}
      trace.goodsReceipts.id: {type: string}
      trace.deliveryNotes: {type: collection}
      trace.deliveryNotes.id: {type: string}
    cannot:
      traceReport: >-
        Batch/serial trace has no public API (05) — the report comes with it.
      block: >-
        The serial-number API itself is missing upstream (the entity is blocked).
      release: >-
        The serial-number API itself is missing upstream (the entity is blocked).
  Tag:
    label: Tag
    reviewed: null
    operations: [list, read]
    fields:
      object: {type: string}
      id: {type: string}
      label: {type: string, must: [filter, search]}
      slug: {type: string, must: [filter]}
      color: {type: string}
      group: {type: string, must: [filter]}
      createdAt: {type: datetime, must: [sort]}
      updatedAt: {type: datetime, must: [sort]}
  Task:
    label: Task
    reviewed: null
    operations: [list, read, create, update, delete]
    fields:
      object: {type: string}
      id: {type: string}
      title: {type: string, required: true, must: [create, update, filter, search]}
      description: {type: string, must: [create, update, search]}
      status: {type: select, must: [create, update, filter], options: [open, inProgress, completed]}
      priority: {type: select, must: [create, update, filter], options: [low, normal, high]}
      assignee:
        type: reference
        ref: Employee
        must: [create, update, filter]
        gaps:
          - ops: [create, update]
            reason: >-
              The one thing that would make a task a work item. `assignee` is readOnly upstream:
              a create or update carrying it answers 2xx and leaves the field null. Measured on
              mvp 2026-08-02.
      notes: {type: string, must: [create, update]}
      dates: {type: embedded}
      dates.due: {type: date, must: [create, update, filter, sort]}
      dates.dueTime: {type: string, must: [create, update]}
      dates.isAllDay: {type: boolean, must: [create, update]}
      dates.completed:
        type: date
        must: [update, filter, sort]
        gaps:
          - ops: [update]
            reason: >-
              Completing a task through the API does not stamp its completion date: `status:
