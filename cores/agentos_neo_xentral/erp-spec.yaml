        type: collection
        must: [read]
        gaps:
          - ops: [read]
            reason: >-
              Counting positions (expected/counted/difference with values) live in the
              counting-list reports — not composed into the API payload yet; needed for the GoBD
              difference review.
      positions.storageLocation: {type: reference, ref: StorageLocation}
      positions.product: {type: reference, ref: Product}
      positions.expected: {type: embedded}
      positions.expected.value: {type: decimal}
      positions.expected.unit: {type: string}
      positions.counted:
        type: embedded
        must: [update]
        gaps:
          - ops: [update]
            reason: >-
              Submitting counted quantities via API (mobile counting) — needed for headless
              inventory.
      positions.counted.value: {type: decimal}
      positions.counted.unit: {type: string}
      positions.difference: {type: embedded}
      positions.difference.value: {type: decimal}
      positions.difference.unit: {type: string}
      documents: {type: embedded}
      documents.stockMovements:
        type: collection
        must: [read]
        gaps:
          - ops: [read]
            reason: >-
              Posted correction movements per stock take need the stockMovements API (docs/05
              #1) to be traceable.
      documents.stockMovements.id: {type: string}
      createdAt: {type: datetime}
      updatedAt: {type: datetime}
    cannot:
      startCounting: >-
        v1 inventoryRuns is read-only — no state writes.
      submit: >-
        v1 inventoryRuns is read-only — no state writes.
      post: >-
        v1 inventoryRuns is read-only — no state writes.
      cancel: >-
        v1 inventoryRuns is read-only — no state writes.
      exportCountingList: >-
        Counting-list export is not exposed.
      recount: >-
        Recount has no public trigger.
      addPosition: >-
        Adding positions is not exposed via v1 inventoryRuns.
  PickingRun:
    label: Picking run
    reviewed: null
    operations: [list, read]
    fields:
      object: {type: string}
      id:
        type: string
        must: [create]
        gaps:
          - ops: [create]
            reason: >-
              Creating a picking run by criteria (wave: channel, shipping method, cutoff,
              maxOrders) has NO upstream endpoint — the main gap (docs/05 #3); execution
              (start/complete, totes) already exists.
      criteria:
        type: embedded
        must: [read]
        gaps:
          - ops: [read]
            reason: >-
              Pick-run criteria (channel, shipping method) are not exposed by v1 pickLists.
      criteria.channel: {type: reference, ref: Channel}
      criteria.shippingMethod: {type: reference, ref: ShippingMethod}
      orders:
        type: collection
        must: [read]
        gaps:
          - ops: [read]
            reason: >-
              The picked sales orders are not exposed by v1 pickLists (only counts).
      orders.id: {type: string}
      containers:
        type: collection
        must: [read]
        gaps:
          - ops: [read]
            reason: >-
              Totes/containers are not exposed by v1 pickLists.
      containers.name: {type: string}
      containers.barcode: {type: string}
      number: {type: string}
      name: {type: string}
      status: {type: select, must: [filter], options: [draft, released, inProgress, picked, completed, cancelled]}
      strategy:
        type: select
        must: [create]
        gaps:
          - ops: [create]
            reason: >-
              Choosing the picking strategy (single/multiOrder/wave/zone) at creation — no
              create endpoint today.
      warehouse: {type: reference, ref: Warehouse}
      assignedTo: {type: collection}
      assignedTo.name: {type: string}
      progress: {type: embedded}
      progress.deliveryNotes: {type: integer}
      progress.products: {type: integer}
      progress.totalWeight: {type: decimal}
      tasks:
        type: collection
        must: [read]
        gaps:
          - ops: [read]
            reason: >-
              Task-level detail (location, product, quantity, status per pick) is not exposed on
              the pickLists API — needed for progress boards and pick-path optimisation.
      tasks.status:
        type: select
        must: [update]
        gaps:
          - ops: [update]
            reason: >-
              Granular task-level pick confirmation with quantity + scans (docs/05 #3) — today
              only whole-list start/complete exists.
      tasks.storageLocation: {type: reference, ref: StorageLocation}
      tasks.product: {type: reference, ref: Product}
      tasks.quantity: {type: embedded}
      tasks.quantity.value: {type: decimal}
      tasks.quantity.unit: {type: string}
      documents: {type: embedded}
      documents.deliveryNotes: {type: collection}
      documents.deliveryNotes.id: {type: string}
      createdAt: {type: datetime}
      updatedAt: {type: datetime}
    cannot:
      release: >-
        v1 pickLists is read-only — no state writes.
      start: >-
        v1 pickLists is read-only — no state writes.
      pause: >-
        v1 pickLists is read-only — no state writes.
      complete: >-
        v1 pickLists is read-only — no state writes.
      cancel: >-
        v1 pickLists is read-only — no state writes.
      assign: >-
        Picker assignment is not exposed.
      reprioritize: >-
        Priority changes are not exposed.
      printPickList: >-
        Pick-list print/PDF is not exposed.

masterdata:
  Customer:
    label: Customer
    reviewed: null
    operations: [list, read, create, update, delete]
    fields:
      object: {type: string}
      id: {type: string}
      number:
        type: string
        must: [create, update, filter, sort, search]
        gaps:
          - ops: [update]
            reason: >-
              Correcting a customer number after the fact. v3 accepts a number on POST but not
              on PATCH, so a typo in a migrated number can only be fixed in the UI.
      type:
        type: select
        must: [create, update]
        gaps:
          - ops: [create, update]
            reason: >-
              Customer vs. lead (Interessent). v2 has isLead, but no v3 customers payload
              carries it — not in the record, not behind any allowed include — so the core
              cannot set it without leaving v3. Roughly half a typical CRM migration is leads,
              so they all land as customers today.
      status:
        type: select
        must: [read, update]
        options: [active, archived]
        gaps:
          - ops: [read, update]
            reason: >-
              Active/archived state is not exposed via v3 customers — needed for honest
              archiving (plan §6.1).
      parent:
        type: reference
        ref: Customer
        must: [read, update]
        gaps:
          - ops: [read, update]
            reason: >-
              B2B hierarchy (branch → HQ) is not exposed via the public API (plan §6.1 parent).
      billTo:
        type: reference
        ref: Customer
        must: [read, update]
        gaps:
          - ops: [read, update]
            reason: >-
              Central billing (Zentralregulierung — invoice to association/HQ) is not exposed
              (plan §6.1 billTo).
      channels:
        type: collection
        must: [read]
        gaps:
          - ops: [read]
            reason: >-
              Per-channel external ids (channel links) are not exposed via the public API.
      channels.channel: {type: reference, ref: Channel}
      channels.externalId: {type: string}
      name: {type: string, required: true, must: [create, update, filter, sort, search]}
      email: {type: string, must: [create, update, filter, search]}
      phone: {type: string, must: [create, update]}
      website: {type: string, must: [create, update]}
      vatId: {type: string, must: [create, update]}
      language: {type: string, must: [create, update]}
      addresses: {type: collection, must: [create, update]}
      addresses.id: {type: string}
      addresses.type:
        type: select
        must: [create, update]
        options: [billing, shipping, both]
        gaps:
          - ops: [create, update]
            contested: [create, update]
            reason: >-
              Set the address role incl. the 'both' value (one address serving billing AND
              shipping) — v3 splits billing (primaryAddress/deviating) vs shipping
              (deliveryAddresses) by store, so the role is not a freely settable field.
      addresses.label:
        type: string
        must: [read, create, update]
        gaps:
          - ops: [read, create, update]
            contested: [create, update]
            reason: >-
              Free label/name per address location (e.g. 'Lager München') — v3 knows only
              billing/shipping roles, no named locations.
      addresses.isDefault:
        type: boolean
        must: [read, create, update]
        gaps:
          - ops: [read, create, update]
            contested: [create, update]
            reason: >-
              Mark the standard address per type (unified-address model; at most one default per
              customer & type) — v3 partner addresses carry no isDefault flag.
      addresses.name: {type: string, must: [create, update]}
      addresses.contactPerson: {type: string, must: [create, update]}
      addresses.street: {type: string, must: [create, update, filter, sort, search]}
      addresses.zip: {type: string, must: [create, update, filter, sort, search]}
      addresses.city: {type: string, must: [create, update, filter, sort, search]}
      addresses.state: {type: string, must: [create, update, filter, sort]}
      addresses.country: {type: string, must: [create, update, filter, sort]}
      addresses.gln: {type: string, must: [create, update]}
      addresses.email: {type: string, must: [create, update]}
      addresses.phone: {type: string, must: [create, update]}
      contacts: {type: collection, must: [create, update]}
      contacts.id: {type: string}
      contacts.type: {type: select, must: [create, update], options: [mr, mrs, company, other]}
      contacts.name: {type: string, required: true, must: [create, update]}
      contacts.title: {type: string, must: [create, update]}
      contacts.salutation: {type: string, must: [create, update]}
      contacts.position: {type: string, must: [create, update]}
      contacts.department: {type: string, must: [create, update]}
      contacts.subDepartment: {type: string, must: [create, update]}
      contacts.email: {type: string, must: [create, update]}
      contacts.phone: {type: string, must: [create, update]}
      contacts.mobile: {type: string, must: [create, update]}
      contacts.fax: {type: string, must: [create, update]}
      contacts.language: {type: string, must: [create, update]}
      contacts.birthday: {type: date, must: [create, update]}
      contacts.allowMarketingEmails: {type: boolean, must: [create, update]}
      contacts.remarks: {type: text, must: [create, update]}
      contacts.internalNote: {type: text, must: [create, update]}
      defaults: {type: embedded}
      defaults.currency: {type: string}
      defaults.language: {type: string}
      defaults.paymentMethod:
        type: reference
        ref: PaymentMethod
        must: [create, update]
        gaps:
          - ops: [create, update]
            reason: >-
              Default payment method per customer.
      defaults.paymentTerms: {type: embedded}
      defaults.paymentTerms.dueDays:
        type: integer
        must: [create, update]
        gaps:
          - ops: [create, update]
            reason: >-
              Default payment term for the customer — drives every order/invoice; must be
              settable.
      defaults.paymentTerms.discountPercent: {type: decimal}
      defaults.paymentTerms.discountDays: {type: integer}
      defaults.taxation:
        type: select
        must: [create, update]
        gaps:
          - ops: [create, update]
            reason: >-
              Default taxation scheme (domestic/euB2B/euOss/export) per customer.
      defaults.shippingMethod:
        type: reference
        ref: ShippingMethod
        must: [read, update]
        gaps:
          - ops: [read, update]
            reason: >-
              The default shipping method is not surfaced by the v3 partner read.
      defaults.priceList:
        type: reference
        ref: PriceList
        must: [read, update]
        gaps:
          - ops: [read, update]
            reason: >-
              The assigned price list is not surfaced by the v3 partner read.
      defaults.partialShipping:
        type: select
        must: [read, update]
        gaps:
          - ops: [read, update]
            reason: >-
              The partial-shipping preference is not surfaced by the v3 partner read.
      finance: {type: embedded}
      finance.openAmount:
        type: embedded
        must: [read]
        gaps:
          - ops: [read]
            reason: >-
              Aggregated open amount per customer is computed nowhere in the API (docs/05 #14) —
              must be derived/served.
      finance.openAmount.amount: {type: string}
      finance.openAmount.currency: {type: string}
      finance.creditLimit:
        type: embedded
        must: [update]
        gaps:
          - ops: [update]
            reason: >-
              The customer credit limit — a core AR control; UI-only today, not writable via API
              (docs/05 #14).
      finance.creditLimit.amount: {type: string}
      finance.creditLimit.currency: {type: string}
      finance.onHold:
        type: boolean
        must: [update]
        gaps:
          - ops: [update]
            reason: >-
              Put a customer on delivery/credit hold — UI-only today (docs/05 #14).
      finance.dunningBlocked:
        type: boolean
        must: [update]
        gaps:
          - ops: [update]
            reason: >-
              Block dunning for a customer — UI-only today.
      finance.debtorAccountNumber: {type: string}
      project: {type: reference, ref: Project, must: [create, update]}
      channel: {type: reference, ref: Channel, must: [create, update]}
      tags: {type: tag, must: [create, update, filter]}
      notes: {type: text, must: [create, update]}
      customFields:
        type: collection
        must: [create, update]
        gaps:
          - ops: [create, update]
            reason: >-
              Custom field values on the customer — today only readable, not writable via API.
      customFields.key: {type: string, must: [create, update]}
      customFields.label: {type: string, must: [create, update]}
      customFields.type: {type: string}
      customFields.value: {type: string, must: [create, update]}
      createdAt: {type: datetime, must: [filter, sort]}
      updatedAt: {type: datetime, must: [filter, sort]}
      contacts.address:
        missing: true
        must: [read, create, update]
        gaps:
          - ops: [read, create, update]
            reason: >-
              Bind a contact person to a specific address (person-at-location) — v3 stores only
              a free-text contactPerson on delivery addresses, not a reference.
      contacts.isPrimary:
        missing: true
        must: [read, create, update]
        gaps:
          - ops: [read, create, update]
            reason: >-
              Mark the main contact person — v3 contactPersons carry no primary flag.
    can:
      addTag: {evidence: pass, params: [title]}
      removeTag: {evidence: pass, params: [title]}
    cannot:
      archive: >-
        No archive flag is writable via v3 customers.
      reactivate: >-
        No archive flag is writable via v3 customers.
      setHold: >-
        Customer holds (delivery/invoice block) are not writable via the public API.
      releaseHold: >-
        Customer holds are not writable via the public API.
      mergeInto: >-
        Duplicate merge is a UI-only feature — no API.
      runCreditCheck: >-
        Credit checks have no public trigger.
      statement: >-
        An open-items statement is not exposed via the public API.
