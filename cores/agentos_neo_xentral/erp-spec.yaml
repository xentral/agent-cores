          - ops: [update]
            reason: >-
              Correcting a invoice number after the fact. The v3 create accepts one, but PATCH
              has no slot for it — a number carried over from another system must be right the
              first time.
      status: {type: select, must: [filter], options: [draft, open, paid, partiallyCancelled, cancelled]}
      fixedAt: {type: datetime}
      customer:
        type: reference
        ref: Customer
        required: true
        must: [create, update, filter]
        gaps:
          - ops: [update]
            reason: >-
              Reassign the invoice's partner after creation — v3 accepts it only on create.
      channel: {type: reference, ref: Channel}
