          - ops: [create, update]
            reason: >-
              Deviating tax rate per position. Upstream derives the line tax from the product's
              tax class and the customer's tax rule; v3 accepts taxRate on a line item, answers
              2xx and keeps its own value — measured on mvp 2026-08-01 (sent "reduced", read
              back "standard", on create and on update alike). Needs a real write path upstream.
      currency: {type: string, must: [create, update]}
      totals: {type: embedded}
      totals.currency: {type: string}
      totals.net: {type: string}
      totals.gross: {type: string}
      totals.settled: {type: string}
      totals.outstanding:
        type: string
        must: [read]
