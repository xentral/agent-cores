      dates.created: {type: date, must: [filter, sort]}
      recurrence: {type: embedded}
      recurrence.interval: {type: select, must: [create, update, filter]}
      links: {type: embedded}
      links.customer: {type: reference, ref: Customer, must: [create, update, filter]}
      links.contactPerson: {type: reference, must: [create, update, filter]}
      links.project: {type: reference, ref: Project, must: [create, update]}
      links.subProject: {type: reference, must: [create, update]}
      visibility: {type: embedded}
      visibility.isPublic: {type: boolean, must: [create, update, filter]}
      visibility.onStartPage: {type: boolean, must: [create, update, filter]}
      visibility.onBulletinBoard: {type: boolean, must: [create, update, filter]}
      reminder: {type: embedded}
      reminder.byEmail: {type: boolean, must: [create, update]}
      reminder.daysBefore: {type: integer, must: [create, update]}
      reminder.advanceNoticeDays: {type: integer, must: [create, update]}
      timeTracking: {type: embedded}
      timeTracking.hours: {type: decimal, must: [create, update]}
      timeTracking.required: {type: boolean, must: [create, update]}
      timeTracking.billable: {type: boolean, must: [create, update]}
      timeTracking.loggedAt: {type: datetime, must: [create, update, sort]}
      createdAt: {type: datetime, must: [sort]}
      updatedAt: {type: datetime, must: [sort]}
      timeline:
        missing: true
        must: [read]
        gaps:
          - ops: [read]
            reason: >-
              The task's comment thread. Declared `readWrite` with a full sub-node and returned
              by NO read — not the list, not the single read, and no include/expand parameter
              produces it. Not modelled until it reads back.

crm:
  Correspondence:
