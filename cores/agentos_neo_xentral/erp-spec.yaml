      payment.terms: {type: embedded}
      payment.terms.dueDays:
        type: integer
        must: [create, update]
        gaps:
          - ops: [create, update]
            reason: >-
              Net payment term in days — drives the due date and dunning.
      payment.terms.discountPercent:
        type: decimal
        must: [create, update]
        gaps:
          - ops: [create, update]
            reason: >-
              Cash-discount percentage — standard DACH B2B.
      payment.terms.discountDays:
        type: integer
        must: [create, update]
        gaps:
          - ops: [create, update]
            reason: >-
              Cash-discount period in days — pairs with the discount.
      payment.dueDate: {type: date}
      payment.discountDate: {type: date}
      payment.status: {type: select, must: [filter], options: [unpaid, partiallyPaid, paid]}
      payment.payments: {type: collection}
      payment.payments.id: {type: string}
      payment.payments.number: {type: string}
      dunning: {type: embedded}
      dunning.level: {type: select, must: [create, update]}
      dunning.blocked:
        type: boolean
        must: [create, update]
        gaps:
          - ops: [update]
            contested: [update]
            reason: >-
              Block/unblock dunning per invoice — a core AR control not writable upstream today.
      dunning.lastReminderAt: {type: datetime}
      dunning.note:
        type: string
        must: [create, update]
        gaps:
          - ops: [update]
            contested: [update]
            reason: >-
              A dunning note for the AR clerk — must be writable.
      eInvoice:
        type: embedded
        must: [read]
        gaps:
          - ops: [read]
            reason: >-
              The finished ZUGFeRD/XRechnung artefact + delivery status is a missing upstream
              API (docs/05 #7) — only XML raw data exists today.
      eInvoice.format: {type: string}
      eInvoice.status: {type: string}
      eInvoice.buyerReference: {type: string}
      eInvoice.downloadUrl: {type: string}
      texts: {type: embedded}
      texts.intro: {type: string, must: [create, update]}
      texts.outro: {type: string, must: [create, update]}
      note: {type: string, must: [create, update]}
      documents: {type: embedded}
      documents.salesOrder: {type: reference, ref: SalesOrder, must: [filter]}
      documents.deliveryNotes: {type: collection}
      documents.deliveryNotes.id: {type: string}
      documents.deliveryNotes.number: {type: string}
      documents.creditNotes: {type: collection}
      documents.creditNotes.id: {type: string}
      documents.creditNotes.number: {type: string}
      tags: {type: tag, must: [create, update, filter]}
      writeProtection: {type: boolean, must: [filter]}
      customFields:
        type: embedded
        must: [create, update]
        gaps:
          - ops: [create, update]
            reason: >-
              Custom field values on the invoice — today only readable via include, not writable
              via API.
      createdAt: {type: datetime, must: [filter, sort]}
      updatedAt: {type: datetime, must: [filter, sort]}
      items.totals.tax:
        missing: true
        must: [read]
        gaps:
          - ops: [read]
            reason: >-
              Tax amount per line. v3 states only taxRate and effectiveTaxRate on a line — no
              money figure — so the tax a position carries cannot be read. The core will not
              derive it from gross minus net: that is a number Xentral never stated, and
              line-level rounding against the legacy PDF (projekt.preisberechnung) is still an
              open decision, so a derived value could silently disagree with the printed
              document. Per-rate tax exists on the document totals; the line needs its own.
    can:
      send: {evidence: reachable}
      downloadPdf: {evidence: pass}
      addTag: {evidence: pass, params: [title]}
      removeTag: {evidence: pass, params: [title]}
      release: {evidence: reachable}
      cancel: {evidence: executed}
      setWriteProtection: {evidence: null}
      removeWriteProtection: {evidence: null}
    cannot:
      registerPayment: >-
