# The ERP specification of this core — reviewed by a domain expert.
#
# READ THIS FIRST: the direction of proof runs from here TO the code. This file states
# what the ERP must be able to do and to record; CI replays every statement against the
# core's own metadata and against the live-probe results in `verified.json`
# (tests/test_core_playbooks.py). When the two disagree, the default reading is that the
# CORE is wrong — not that this file needs adjusting to match it.
#
# It is deliberately NOT generated. It is checked against the very metadata a generator
# would derive it from, so generating it would turn every rule into a tautology that can
# never fail again. A specification derived from the implementation also cannot state
# what is still missing, which is the only reason a domain expert would read it.
#
# This file SHIPS: the core loads it at runtime and renders each recorded gap where it
# applies — on the action, or on the field — so a builder reads "not possible, and here
# is why" at the point of use rather than mere absence. Absence is indistinguishable
# from "nobody looked".
#
# Layout
# ------
# Grouped `category → entity → everything about that entity`, so one block answers
# "what can this system do with an order". The categories are the core's OWN
# `manifest.category` — the same value `describe` ships — not a taxonomy this file
# invents; a rule enforces that every entity sits under the one its adapter declares.
# Inside a category, entities follow the process chain (customer → quote → order →
# delivery → invoice → return → credit note, then purchasing, then master data) and
# then alphabetically, matching the order `review.xlsx` reads in.
#
# Per entity
# ----------
# label               what the entity is called, mirrored from the core (checked)
# reviewed            sign-off ledger: the date a domain expert went through this
#                     entity, or null. NOT a gate — an unreviewed core is a normal
#                     state, and gating it would only get the ledger filled to quiet CI
# operations          the CRUD surface. Stated for every entity: read-only vs writable
#                     is a business decision, and left as a sample this section reads
#                     as "these are the interesting ones" when it means "nobody wrote
#                     down the rest"
# statuses            the lifecycle vocabulary of each status-shaped field
# requiredForCreate   what a create must carry
# filterable          what must be queryable
# notFilterable       documented traps: the field exists but cannot be queried
# fields              field paths the reviewer decided must exist. Deliberately NOT an
#                     inventory of the model — a sample, and reading it as a complete
#                     statement is the mistake this note exists to prevent
# can                 the capability works, with the verdict a live run returned:
#                     `pass` (effect read back — proof), `executed` (something changed,
#                     nobody looked), `reachable` (the route exists and refused our
#                     probe — NO claim either way), `null` (never tested). `params`
#                     names the required command parameters. Checked against
#                     verified.json in both directions, so the number of unproven
#                     capabilities cannot drift upward quietly
# cannot              the capability is needed but the upstream cannot do it, mapped to
#                     the measured reason. The ADAPTER still classifies it (`wish=True`);
#                     this file supplies the text. If this file decided both, the two
#                     rules that matter most — a required capability must not be a gap,
#                     a recorded gap must still be one — would compare it against itself
# fieldGaps           field × operation the merchant needs and the API cannot serve,
#                     with the business reason. An entry retires itself once a live
#                     probe proves the facet; a STALE one is the dangerous kind, because
#                     a gap outranks a real capability wherever it is shown
#
# Empty sections are omitted rather than written as {} — absence and emptiness do not
# differ here, and the completeness rules derive "this entity has no capabilities" from
# the core. `reviewed` is the exception and is always written: a missing entry in a
# sign-off ledger cannot be told apart from a forgotten one.
#
# Was `capabilities.spec.yaml` + `field-gaps.yaml`, organised by section. Finding out
# what the system could do with an order meant reading eleven places in two files, and
# three sections carried the entity as a string prefix (`"SalesOrder.status"`).

documents:
  Quote:
    label: Quote
    reviewed: null
    operations: [list, read, create, update, delete]
    statuses:
      status: [draft, sent, accepted, declined, expired, cancelled]
    requiredForCreate: [customer, items.product, items.quantity]
    can:
      send: {evidence: reachable}
      downloadPdf: {evidence: pass}
      addTag: {evidence: pass, params: [title]}
      removeTag: {evidence: pass, params: [title]}
      release: {evidence: reachable}
      cancel: {evidence: reachable}
      setWriteProtection: {evidence: null}
      removeWriteProtection: {evidence: null}
    cannot:
      convertToSalesOrder: >-
        No conversion endpoint we can reach. v3 has createFromSalesOrder and
        createFromDeliveryNote for invoices and returns, but no createFromOffer for sales
        orders, and POST /v3/salesOrders cannot reference a quote (the relation is read-only).
        v1 salesOrders/import is a raw import, not a conversion. The logic exists —
        Erpapi::WeiterfuehrenAngebotZuAuftrag copies the document and sets the quote to
        commissioned — and is exposed once, as the legacy XML API /api/v1/AngebotZuAuftrag. That
        one is digest-authenticated, hangs on a legacy permission and already sits behind a
        killswitch, so it is not usable from a bearer-token core.
      duplicate: >-
        No duplicate endpoint in any API generation — no v3 action, nothing in v1/v2, nothing in
        the legacy XML API. erpAPI::CopyAngebot() does the work behind the UI only. The same
        function exists for orders, invoices and delivery notes, so one uniform
        actions/duplicate would serve every document type at once.
      accept: >-
        No upstream endpoint. v3 offers has exactly release, cancel, send, logActivity,
        setWriteProtection and removeWriteProtection; UpdateOfferData carries no status, and
        offers do not exist in v1/v2 at all. The transition happens only in the UI. Worth
        settling first: the status 'accepted' (angenommen) is written by no code path and occurs
        in no tenant — the state the ERP really keeps is 'commissioned' (beauftragt), reached as
        a side effect of converting the quote into a sales order.
      decline: >-
        No upstream endpoint. Declining sets angebot.status='abgelehnt' and closes open
        follow-ups — two SQL updates inside the legacy page controller, with no service class,
        no API route and no event. The legacy XML API cannot reach it either: ApiBelegEdit
        whitelists the status values and 'abgelehnt' is not among them.
    fieldGaps:
      - field: references.customerInquiryNumber
        ops: [create, update]
        reason: >-
          The customer's inquiry / RFQ number — B2B standard; read-only upstream today.
      - field: dates.validUntil
        ops: [create, update]
        reason: >-
          Offer validity date — drives auto-expiry and follow-up; must be settable per quote.
      - field: dates.expectedOrderDate
        ops: [create, update]
        reason: >-
          Expected order date feeds the sales forecast — settable per quote.
      - field: dates.requestedDelivery
        ops: [create, update]
        reason: >-
          Desired delivery date on the quote — not writable upstream today.
      - field: payment.method
        ops: [create, update]
        reason: >-
          Payment method proposed on the quote — frequently set per offer.
      - field: payment.terms.dueDays
        ops: [create, update]
        reason: >-
          Payment term proposed on the quote.
      - field: shipping.method
        ops: [create, update]
        contested: [create, update]
        reason: >-
          Shipping method proposed on the quote.
      - field: items.isOptional
        ops: [create, update]
        reason: >-
          Optional line items (not counted in totals) are a core quoting feature — not settable
          upstream today.
      - field: customFields
        ops: [create, update]
        reason: >-
          Custom field values on the quote — today only readable via include, not writable via
          API.
      - field: customer
        ops: [update]
        reason: >-
          Reassign the quote's partner after creation — v3 accepts it only on create.
      - field: items.totals.tax
        ops: [read]
        reason: >-
          Tax amount per line. v3 states only taxRate and effectiveTaxRate on a line — no money
          figure — so the tax a position carries cannot be read. The core will not derive it
          from gross minus net: that is a number Xentral never stated, and line-level rounding
          against the legacy PDF (projekt.preisberechnung) is still an open decision, so a
          derived value could silently disagree with the printed document. Per-rate tax exists
          on the document totals; the line needs its own.
      - field: number
        ops: [create]
        reason: >-
          Carrying a quote number over from another system. The v3 create does not declare
          documentNumber for this document type and ignores a supplied value without an error,
          so the core refuses it instead. salesOrder, invoice and creditNote do accept one.
      - field: items.taxRate
        ops: [create, update]
        reason: >-
          Deviating tax rate per position. Upstream derives the line tax from the product's tax
          class and the customer's tax rule; v3 accepts taxRate on a line item, answers 2xx and
          keeps its own value — measured on mvp 2026-08-01 (sent "reduced", read back
          "standard", on create and on update alike). Needs a real write path upstream.
  SalesOrder:
    label: Sales order
    reviewed: null
    operations: [list, read, create, update, delete]
    statuses:
      status: [draft, confirmed, fulfilled, closed, cancelled]
    requiredForCreate: [customer, items.product, items.quantity]
    filterable:
      - status
      - customer
      - references.customerOrderNumber
      - references.externalNumber
      - references.externalId
      - number
      - writeProtection
      - tags
    fields:
      - writeProtection
      - shipping.method
      - shipping.status
      - items.fulfillment.shipped
      - items.availability.deliverable
      - documents.deliveryNotes
      - documents.salesInvoices
      - trafficLights
    can:
      createSalesInvoice: {evidence: executed}
      split: {evidence: reachable}
      splitOrder: {evidence: reachable, params: [items]}
      downloadPdf: {evidence: pass}
      sendConfirmation: {evidence: reachable}
      addTag: {evidence: pass, params: [title]}
      removeTag: {evidence: pass, params: [title]}
      release: {evidence: reachable}
      close: {evidence: reachable}
      cancel: {evidence: reachable}
      dispatch: {evidence: reachable}
      setWriteProtection: {evidence: null}
      removeWriteProtection: {evidence: null}
    cannot:
      createDeliveryNote: >-
        v1 dispatch couples delivery-note creation with shipping side-effects; a clean
        createDeliveryNote(items?) needs a dedicated endpoint.
      createPickingRun: >-
        Pick list creation has no public endpoint (05 #12).
      addHold: >-
        Holds map to trafficLights — readable, but there is no public write API.
      releaseHold: >-
        Holds map to trafficLights — readable, but there is no public write API.
      allocateStock: >-
        Stock allocation runs upstream automatically; no manual trigger is exposed.
      duplicate: >-
        No duplicate endpoint upstream.
    fieldGaps:
      - field: references.customerOrderNumber
        ops: [create]
        contested: [create]
        reason: >-
          The customer's own order / PO number (B2B standard field). Read-only upstream today; a
          clerk must be able to set and correct it.
      - field: references.customerOrderNumber
        ops: [search]
        contested: [create]
        reason: >-
          On the phone the customer quotes their PO number, not the ERP number — the full-text
          search must reach it.
      - field: references.externalNumber
        ops: [search]
        reason: >-
          Support finds shop orders by the SHOP number the customer has.
      - field: references.externalId
        ops: [search]
        reason: >-
          Automated reconciliation matches by the external id.
      - field: dates.requestedDelivery
        ops: [update]
        contested: [update]
        reason: >-
          Desired delivery date — core fulfilment field; one of the first things entered on an
          order. Not writable upstream today.
      - field: shipping.method
        ops: [create, update]
        contested: [create, update]
        reason: >-
          Carrier / shipping method — core to fulfilment; must be selectable per order.
      - field: customFields
        ops: [create, update]
        reason: >-
          Custom field values carry company-specific data — today only readable via include, not
          writable via API (all documents).
      - field: customFields
        ops: [filter]
        reason: >-
          Companies segment and find orders by their own custom-field values.
      - field: customer
        ops: [update]
        reason: >-
          Reassign the order to the correct customer after creation — v3 accepts the partner
          only on create today.
      - field: fulfillmentPolicy.partialShipping
        ops: [create, update]
        reason: >-
          Partial-shipping policy has no upstream slot — the read reports a hardcoded "allowed".
          Needs a real v3 field before it can be written or trusted.
      - field: billingAddress.zip
        ops: [search]
        reason: >-
          Postal-code search is a standard phone use-case (shop orders).
      - field: billingAddress.email
        ops: [search]
        reason: >-
          Email search is a standard use-case for shop orders — often the only identifier
          support has.
      - field: discounts
        ops: [read]
        reason: >-
          Header discounts/vouchers (e-commerce) are not exposed by v3 salesOrders — only
          line-level discounts exist.
      - field: items.totals.tax
        ops: [read]
        reason: >-
          Tax amount per line. v3 states only taxRate and effectiveTaxRate on a line — no money
          figure — so the tax a position carries cannot be read. The core will not derive it
          from gross minus net: that is a number Xentral never stated, and line-level rounding
          against the legacy PDF (projekt.preisberechnung) is still an open decision, so a
          derived value could silently disagree with the printed document. Per-rate tax exists
          on the document totals; the line needs its own.
      - field: number
        ops: [update]
        reason: >-
          Correcting a sales order number after the fact. The v3 create accepts one, but PATCH
          has no slot for it — a number carried over from another system must be right the first
          time.
      - field: items.taxRate
        ops: [create, update]
        reason: >-
          Deviating tax rate per position. Upstream derives the line tax from the product's tax
          class and the customer's tax rule; v3 accepts taxRate on a line item, answers 2xx and
          keeps its own value — measured on mvp 2026-08-01 (sent "reduced", read back
          "standard", on create and on update alike). Needs a real write path upstream.
  DeliveryNote:
    label: Delivery note
    reviewed: null
    operations: [list, read, create, update, delete]
    statuses:
      status: [draft, picking, shipped, delivered, cancelled]
    requiredForCreate: [customer, items.product, items.quantity]
    filterable: [status, customer, documents.salesOrder]
    fields: [shipments]
    can:
      createReturn: {evidence: reachable, params: [lineItems]}
      createSalesInvoice: {evidence: reachable}
      downloadPdf: {evidence: pass}
      addTag: {evidence: pass, params: [title]}
      removeTag: {evidence: pass, params: [title]}
      release: {evidence: reachable}
      markDelivered: {evidence: reachable}
      cancel: {evidence: reachable}
      setWriteProtection: {evidence: null}
      removeWriteProtection: {evidence: null}
    cannot:
      createShipment: >-
        The carrier label API (printShippingLabel) is beta and not public.
      printLabels: >-
        Per-product label print exists (v1 products/{id}/printLabel); a per-delivery-note batch
        print is not composed.
      startPicking: >-
        Picking is driven by picking runs — no direct startPicking endpoint.
    fieldGaps:
      - field: references.customerOrderNumber
        ops: [create]
        contested: [create]
        reason: >-
          The customer's PO number on the delivery note (B2B) — read-only upstream today; must
          be settable.
      - field: references.customerOrderNumber
        ops: [search]
        contested: [create]
        reason: >-
          Warehouse/support find a delivery note by the customer's PO number.
      - field: warehouse
        ops: [create, update]
        reason: >-
          The picking/shipping warehouse — must be selectable per delivery note, not fixed to
          the default.
      - field: customs.incoterm
        ops: [create, update]
        reason: >-
          Incoterm for export shipments — a customs-declaration essential, not settable via API
          today.
      - field: customs.totalWeight
        ops: [create, update]
        reason: >-
          Total shipment weight for the customs declaration / carrier — needs to be settable.
      - field: customs.note
        ops: [create, update]
        reason: >-
          Customs note for export paperwork.
      - field: customFields
        ops: [create, update]
        reason: >-
          Custom field values on the delivery note — today only readable via include, not
          writable via API.
      - field: customer
        ops: [update]
        reason: >-
          Reassign the delivery note's partner after creation — v3 accepts it only on create.
      - field: items
        ops: [update]
        reason: >-
          Adjust delivered positions/quantities after creation — the v3 update DTO carries no
          line-item write path.
      - field: shipments
        ops: [read]
        reason: >-
          Tracking numbers need a nachlade GET /v1/deliveryNotes/{id}/shipments — not yet
          composed into the read payload.
      - field: billingAddress.zip
        ops: [search]
        reason: >-
          Postal-code search — standard phone use-case for delivery lookups.
      - field: number
        ops: [create]
        reason: >-
          Carrying a delivery note number over from another system. The v3 create does not
          declare documentNumber for this document type and ignores a supplied value without an
          error, so the core refuses it instead. salesOrder, invoice and creditNote do accept
          one.
  Shipment:
    label: Shipment
    reviewed: null
    operations: [list, read]
    statuses:
      status: [label, handedOver, inTransit, delivered, exception, returned]
    notFilterable: [status, documents.salesOrder]
    fields:
      - trackingNumber
      - trackingUrl
      - labelUrl
      - packages.trackingNumber
      - events.location
      - documents.deliveryNote
    cannot:
      createLabel: >-
        Carrier labels run through the beta printShippingLabel API (CIS) on delivery notes — not
        public.
      cancelLabel: >-
        Label cancellation is not exposed.
      downloadLabel: >-
        Label download is not exposed.
      refreshTracking: >-
        Tracking refresh has no public trigger.
    fieldGaps:
      - field: id
        ops: [create]
        reason: >-
          Creating a shipment + label via the facade (POST /v1/shipments + createLabel exists
          upstream) is not orchestrated here yet — needed for headless fulfilment.
      - field: tracking.number
        ops: [search]
        reason: >-
          Support looks up a shipment by tracking number — needs a filterable/searchable
          upstream list parameter.
      - field: status
        ops: [read]
        reason: >-
          The shipment lifecycle status is not exposed by v1 shipments — only sentAt exists.
      - field: weight
        ops: [read]
        reason: >-
          Package weight is not exposed by v1 shipments.
      - field: events
        ops: [read]
        reason: >-
          Carrier tracking events are not exposed — needs a carrier-events feed.
  SalesInvoice:
    label: Sales invoice
    reviewed: null
    operations: [list, read, create, update, delete]
    statuses:
      status: [draft, open, paid, partiallyCancelled, cancelled]
      payment.status: [unpaid, partiallyPaid, paid]
    requiredForCreate: [customer, items.product, items.quantity]
    filterable: [status, customer, payment.status, documents.salesOrder, tags]
    notFilterable: [payment.dueDate]
    fields:
      - writeProtection
      - payment.dueDate
      - payment.discountDate
      - payment.terms.dueDays
      - payment.payments
      - totals.paid
      - totals.outstanding
      - dunning.level
      - dunning.blocked
      - dunning.lastReminderAt
      - dunning.note
    can:
      send: {evidence: reachable}
      downloadPdf: {evidence: pass}
      addTag: {evidence: pass, params: [title]}
      removeTag: {evidence: pass, params: [title]}
      release: {evidence: reachable}
      cancel: {evidence: executed}
      setWriteProtection: {evidence: null}
      removeWriteProtection: {evidence: null}
    cannot:
      registerPayment: >-
        The payments API is not public — no endpoint to register an incoming payment.
      remind: >-
        No endpoint SENDS a reminder. The dunning LEVEL is writable though - PATCH the invoice's
        dunning.level - so an escalation workflow can record the step even where the mail cannot
        be sent.
      writeOff: >-
        Write-offs have no public endpoint.
      downloadEInvoice: >-
        E-invoice (XRechnung/ZUGFeRD) rendering is not exposed via the public API.
    fieldGaps:
      - field: references.customerOrderNumber
        ops: [create]
        contested: [create]
        reason: >-
          The customer's PO number on the invoice (B2B) — read-only upstream today; must be
          settable and correctable.
      - field: references.customerOrderNumber
        ops: [search]
        contested: [create]
        reason: >-
          Support and accounting find invoices by the customer's PO number.
      - field: references.debtorAccountNumber
        ops: [create, update]
        reason: >-
          Deviating debtor account for the FiBu/DATEV export — settable when it differs from the
          customer default.
      - field: payment.method
        ops: [create, update]
        reason: >-
          Payment method on the invoice — central to order-to-cash; frequently overridden.
      - field: payment.terms.dueDays
        ops: [create, update]
        reason: >-
          Net payment term in days — drives the due date and dunning.
      - field: payment.terms.discountPercent
        ops: [create, update]
        reason: >-
          Cash-discount percentage — standard DACH B2B.
      - field: payment.terms.discountDays
        ops: [create, update]
        reason: >-
          Cash-discount period in days — pairs with the discount.
      - field: dunning.blocked
        ops: [update]
        contested: [update]
        reason: >-
          Block/unblock dunning per invoice — a core AR control not writable upstream today.
      - field: dunning.note
        ops: [update]
        contested: [update]
        reason: >-
          A dunning note for the AR clerk — must be writable.
      - field: customFields
        ops: [create, update]
        reason: >-
          Custom field values on the invoice — today only readable via include, not writable via
          API.
      - field: customer
        ops: [update]
        reason: >-
          Reassign the invoice's partner after creation — v3 accepts it only on create.
      - field: eInvoice
        ops: [read]
        reason: >-
          The finished ZUGFeRD/XRechnung artefact + delivery status is a missing upstream API
          (docs/05 #7) — only XML raw data exists today.
      - field: totals.outstanding
        ops: [read]
        reason: >-
          Exact open amount needs readable payment↔invoice allocations (docs/05 #2); today only
          derived from paymentStatus.
      - field: billingAddress.email
        ops: [search]
        reason: >-
          Email search — standard use-case for finding a customer's invoices.
      - field: items.totals.tax
        ops: [read]
        reason: >-
          Tax amount per line. v3 states only taxRate and effectiveTaxRate on a line — no money
          figure — so the tax a position carries cannot be read. The core will not derive it
          from gross minus net: that is a number Xentral never stated, and line-level rounding
          against the legacy PDF (projekt.preisberechnung) is still an open decision, so a
          derived value could silently disagree with the printed document. Per-rate tax exists
          on the document totals; the line needs its own.
      - field: number
        ops: [update]
        reason: >-
          Correcting a invoice number after the fact. The v3 create accepts one, but PATCH has
          no slot for it — a number carried over from another system must be right the first
          time.
      - field: items.taxRate
        ops: [create, update]
        reason: >-
          Deviating tax rate per position. Upstream derives the line tax from the product's tax
          class and the customer's tax rule; v3 accepts taxRate on a line item, answers 2xx and
          keeps its own value — measured on mvp 2026-08-01 (sent "reduced", read back
          "standard", on create and on update alike). Needs a real write path upstream.
  Payment:
    label: Payment
    reviewed: null
    operations: [list, read]
    statuses:
      direction: [incoming, outgoing]
      kind: [incoming, outgoing, refund, chargeback]
    filterable: [kind, bookedAt]
    fields: [allocations.invoice, unallocated]
    cannot:
      allocate: >-
        The payments API itself is missing upstream (the entity is blocked) — allocation comes
        with it.
      unallocate: >-
        The payments API itself is missing upstream — allocation comes with it.
      refund: >-
        The payments API itself is missing upstream — refunds come with it.
    fieldGaps:
      - field: id
        ops: [list]
        reason: >-
          No payment LIST/filter exists upstream — only GET /paymentTransactions/{id} (docs/05
          #2). GET /v3/payments with filters is the ask.
      - field: allocations
        ops: [read, update]
        reason: >-
          Payment↔invoice allocations (n:m) are neither readable nor writable — without them
          exact outstanding amounts are impossible (docs/05 #2).
      - field: kind
        ops: [read]
        reason: >-
          Payout/settlement aggregation (fees, chargebacks) per provider needs docs/05 #8.
  Return:
    label: Return
    reviewed: null
    operations: [list, read, create, update, delete]
    statuses:
      status: [requested, received, checked, settled, cancelled]
    requiredForCreate: [customer, items.product, items.quantity, items.reason]
    filterable: [status, customer, dates.requested, documents.salesOrder]
    fields: [items.reason, items.receivedQuantity, items.creditedQuantity, resolution.creditNote]
    can:
      createFromDeliveryNote: {evidence: reachable, params: [deliveryNote, lineItems]}
      createCreditNote: {evidence: executed}
      downloadPdf: {evidence: pass}
      addTag: {evidence: pass, params: [title]}
      removeTag: {evidence: pass, params: [title]}
      release: {evidence: reachable}
      settle: {evidence: reachable}
      cancel: {evidence: reachable}
      setWriteProtection: {evidence: null}
      removeWriteProtection: {evidence: null}
      restock: {evidence: null, params: [date, items]}
    cannot:
      sendReturnLabel: >-
        Return labels run through the beta carrier label API — not public.
      createReplacementOrder: >-
        No replacement-order endpoint upstream.
      receive: >-
        Receiving has no upstream endpoint — v3 returnOrders offers complete/cancel only.
      check: >-
        The check step has no upstream endpoint.
    fieldGaps:
      - field: references.rmaNumber
        ops: [create, update]
        reason: >-
          The RMA number the customer quotes — no upstream field today; core to returns
          handling.
      - field: references.rmaNumber
        ops: [search]
        reason: >-
          Support finds a return by the RMA number the customer has.
      - field: references.customerOrderNumber
        ops: [create, update]
        reason: >-
          The customer's PO number on the return — read-only upstream today.
      - field: items.reason
        ops: [create, update]
        contested: [create]
        reason: >-
          The return reason per line — essential for returns analytics; not settable via API
          today.
      - field: items.condition
        ops: [create, update]
        reason: >-
          Item condition (resellable/damaged/disposal) drives restocking — not in the v3 payload
          yet.
      - field: items.action
        ops: [create, update]
        reason: >-
          Resolution per line (credit/replace/repair) — not in the v3 payload yet.
      - field: warehouse
        ops: [create, update]
        reason: >-
          The returns warehouse must be selectable per return.
      - field: customFields
        ops: [create, update]
        reason: >-
          Custom field values on the return — today only readable via include, not writable via
          API.
      - field: customer
        ops: [update]
        reason: >-
          Reassign the partner after creation — v3 accepts it only on create.
      - field: items
        ops: [update]
        reason: >-
          Edit return positions after creation — the v3 update DTO carries no line-item write
          path.
      - field: items.condition
        ops: [read]
        reason: >-
          Item condition is not surfaced by the v3 return payload yet (docs/05 #4 batch/trace
          family).
      - field: number
        ops: [create]
        reason: >-
          Carrying a return number over from another system. The v3 create does not declare
          documentNumber for this document type and ignores a supplied value without an error,
          so the core refuses it instead. salesOrder, invoice and creditNote do accept one.
  CreditNote:
    label: Credit note
    reviewed: null
    operations: [list, read, create, update, delete]
    statuses:
      status: [draft, open, settled, cancelled]
      kind: [correction, cancellation]
      settlement.mode: [refund, offset]
    requiredForCreate: [customer, items.product, items.quantity]
    can:
      send: {evidence: reachable}
      downloadPdf: {evidence: pass}
      addTag: {evidence: pass, params: [title]}
      removeTag: {evidence: pass, params: [title]}
      release: {evidence: reachable}
      setWriteProtection: {evidence: null}
      removeWriteProtection: {evidence: null}
    cannot:
      registerRefund: >-
        The payments API is not public — no endpoint to register an outgoing refund.
      offsetAgainstInvoice: >-
        Offsetting has no public endpoint.
      cancel: >-
        A released credit note can only be cancelled in the Xentral UI (legacy); v3 exposes no
        cancel action. Drafts are removed with `delete`.
    fieldGaps:
      - field: references.customerOrderNumber
        ops: [create]
        contested: [create]
        reason: >-
          The customer's PO number on the credit note (B2B) — read-only upstream today.
      - field: references.debtorAccountNumber
        ops: [create, update]
        reason: >-
          Deviating debtor account for the FiBu/DATEV export of the credit note.
      - field: dates.serviceDate
        ops: [create, update]
        reason: >-
          Leistungsdatum — a §14 UStG mandatory field on the credit note; must be settable.
      - field: settlement.mode
        ops: [create, update]
        reason: >-
          Refund vs offset-against-invoice is a per-credit-note decision — not settable upstream
          today.
      - field: customFields
        ops: [create, update]
        reason: >-
          Custom field values on the credit note — today only readable via include, not writable
          via API.
      - field: customer
        ops: [update]
        reason: >-
          Reassign the partner after creation — v3 accepts it only on create.
      - field: totals.outstanding
        ops: [read]
        reason: >-
          Exact open amount needs readable refund/offset allocations (docs/05 #2); today derived
          from paymentStatus only.
      - field: items.totals.tax
        ops: [read]
        reason: >-
          Tax amount per line. v3 states only taxRate and effectiveTaxRate on a line — no money
          figure — so the tax a position carries cannot be read. The core will not derive it
          from gross minus net: that is a number Xentral never stated, and line-level rounding
          against the legacy PDF (projekt.preisberechnung) is still an open decision, so a
          derived value could silently disagree with the printed document. Per-rate tax exists
          on the document totals; the line needs its own.
      - field: number
        ops: [update]
        reason: >-
          Correcting a credit note number after the fact. The v3 create accepts one, but PATCH
          has no slot for it — a number carried over from another system must be right the first
          time.
      - field: items.taxRate
        ops: [create, update]
        reason: >-
          Deviating tax rate per position. Upstream derives the line tax from the product's tax
          class and the customer's tax rule; v3 accepts taxRate on a line item, answers 2xx and
          keeps its own value — measured on mvp 2026-08-01 (sent "reduced", read back
          "standard", on create and on update alike). Needs a real write path upstream.
  PurchaseOrder:
    label: Purchase order
    reviewed: null
    operations: [list, read, create, update, delete]
    statuses:
      status: [draft, sent, confirmed, received, closed, cancelled]
    requiredForCreate: [supplier, items.product, items.quantity]
    filterable: [status, supplier]
    fields: [confirmation.supplierOrderNumber]
    can:
      send: {evidence: reachable}
      downloadPdf: {evidence: pass}
      addTag: {evidence: pass, params: [title]}
      removeTag: {evidence: pass, params: [title]}
      release: {evidence: reachable}
      close: {evidence: reachable}
      cancel: {evidence: reachable}
      setWriteProtection: {evidence: null}
      removeWriteProtection: {evidence: null}
      createGoodsReceipt: {evidence: null, params: [date, items]}
    cannot:
      recordConfirmation: >-
        Supplier order confirmations have no public endpoint.
      requestConfirmation: >-
        No public endpoint to request a supplier confirmation.
      createPurchaseInvoice: >-
        Creating a supplier invoice from the order is not composed yet (BF supplierInvoice
        create exists as raw entity CRUD).
      updateDeliveryDates: >-
        A bulk delivery-date update has no endpoint; per-item dates go through a normal update.
    fieldGaps:
      - field: references.supplierOfferNumber
        ops: [create, update]
        reason: >-
          The supplier's quote number we ordered against — read-only upstream today.
      - field: references.ourCustomerNumber
        ops: [create, update]
        reason: >-
          Our customer number at the supplier — belongs on the PO, not settable via API today.
      - field: confirmation.supplierOrderNumber
        ops: [update]
        reason: >-
          The AB (order-confirmation) number from the supplier — the whole confirmation block is
          read-only upstream (docs/05: AB handling).
      - field: confirmation.status
        ops: [update]
        reason: >-
          Recording the confirmation status (pending/confirmed/deviating) is core purchasing —
          not writable via API today.
      - field: dates.requestedDelivery
        ops: [create, update]
        reason: >-
          Requested delivery date at the supplier — not writable upstream today.
      - field: warehouse
        ops: [create, update]
        reason: >-
          The receiving warehouse for the PO must be selectable.
      - field: customFields
        ops: [create, update]
        reason: >-
          Custom field values on the PO — today only readable via include, not writable via API.
      - field: supplier
        ops: [update]
        reason: >-
          Reassign the PO's supplier after creation — v3 accepts it only on create.
      - field: items
        ops: [update]
        reason: >-
          Edit PO positions after creation — the v3 update DTO carries no line-item write path.
      - field: dropship
        ops: [read, create]
        reason: >-
          Dropshipping (Strecke: salesOrder link + customer delivery address) is not exposed via
          v3 purchaseOrders.
      - field: number
        ops: [create]
        reason: >-
          Carrying a purchase order number over from another system. The v3 create does not
          declare documentNumber for this document type and ignores a supplied value without an
          error, so the core refuses it instead. salesOrder, invoice and creditNote do accept
          one.
      - field: items.taxRate
        ops: [create, update]
        reason: >-
          Deviating tax rate per position. Upstream derives the line tax from the product's tax
          class and the customer's tax rule; v3 accepts taxRate on a line item, answers 2xx and
          keeps its own value — measured on mvp 2026-08-01 (sent "reduced", read back
          "standard", on create and on update alike). Needs a real write path upstream.
  GoodsReceipt:
    label: Goods receipt
    reviewed: null
    operations: [list, read]
    statuses:
      status: [open, posted, closed, cancelled]
    filterable: [number, status]
    cannot:
      post: >-
        There is no posting TRANSITION: a goods receipt is booked at creation —
        PurchaseOrder.createGoodsReceipt (or the return's equivalent) moves the stock as it
        writes the document. Nothing to wait for here.
      cancel: >-
        Goods-receipt storno is a known upstream gap (05 #9).
      proposeStorageLocations: >-
        Putaway proposals have no public endpoint.
      printProductLabels: >-
        Per-product label print exists (v1 products/{id}/printLabel); a per-receipt batch print
        is not composed.
      printBatchLabels: >-
        Batch labels have no public endpoint.
    fieldGaps:
      - field: status
        ops: [update]
        reason: >-
          Cancel/storno of a posted goods receipt — the remaining upstream gap after the BF
          entity list covered browsing (docs/05 #9 revised).
      - field: references.supplierDeliveryNoteNumber
        ops: [create, update, read]
        reason: >-
          The supplier's delivery-note number on the goods receipt — needed for the three-way
          match; not in the BF record yet.
      - field: items
        ops: [read, create, update]
        reason: >-
          Line items (product × quantity × storage location, quality check per line) are not
          exposed on the BF goodsReceipt record — creation still goes through the PO action
          only.
      - field: dates.received
        ops: [read]
        reason: >-
          Received/posted dates are not exposed — only createdAt/updatedAt exist on the BF
          entity.
      - field: dates.posted
        ops: [read]
        reason: >-
          Received/posted dates are not exposed — only createdAt/updatedAt exist on the BF
          entity.
  PurchaseInvoice:
    label: Purchase invoice
    reviewed: null
    operations: [list, read, create, update, delete]
    statuses:
      status: [received, matched, approved, paid, rejected]
      match.status: [pending, matched, mismatch]
    requiredForCreate: [supplier]
    notFilterable: [status]
    cannot:
      approve: >-
        The BF InvoiceCheck/DocumentStatus process steps are readable, but the write transition
        is not exposed. Candidate: v1 liabilities/{id}/actions/release — needs the numeric id,
        which the BF rows do not carry.
      reject: >-
        Rejecting has no exposed write transition.
      rematch: >-
        Matching runs upstream automatically; no re-trigger endpoint is exposed.
      registerPayment: >-
        The payments API is not public — no endpoint to register an outgoing payment.
      schedulePayment: >-
        Payment runs have no public API.
      attachFile: >-
        Candidate: v1 liabilities/{id}/documents (upload) — needs the numeric id, which the BF
        rows do not carry.
    fieldGaps:
      - field: number
        ops: [create, update]
        reason: >-
          The document number is system-assigned: sending `documentNumber` on create answers 201
          and the record comes back with an empty number (measured on mvp 2026-08-02). Same
          behaviour as the other documents.
      - field: match.status
        ops: [update]
        reason: >-
          Re-running/overriding the match verdict via API (rematch) — the check statuses are
          readable now; a command to re-evaluate is still missing upstream.
      - field: approval.status
        ops: [update]
        reason: >-
          Approve/reject via API: BF process steps (GoodsCheck/InvoiceCheck/Payment) are
          reported to exist — wiring + live verification of those steps is pending (steps were
          empty on the test instance's metadata).
      - field: status
        ops: [filter]
        reason: >-
          Filtering incoming invoices by workflow status is the AP daily view — the BF
          supplierInvoice API does not allow filtering documentStatus today.
      - field: payment.status
        ops: [filter]
        reason: >-
          Open-liabilities view needs filtering by payment status — not allowed on the BF
          supplierInvoice API today.
      - field: dates.invoiceDate
        ops: [sort]
        reason: >-
          Sorting incoming invoices by invoice date — dateOfSupplierInvoice is not sortable on
          the BF API today.
      - field: approval.by
        ops: [read]
        reason: >-
          The approver is not exposed — BF supplierInvoice carries only the check statuses.
      - field: approval.at
        ops: [read]
        reason: >-
          The approval timestamp is not exposed by the BF supplierInvoice entity.
  StockMovement:
    label: Stock movement
    reviewed: null
    operations: [create]
    statuses:
      type: [receipt, issue, transfer, correction]
    requiredForCreate: [type, product]
    fieldGaps:
      - field: id
        ops: [list, read]
        reason: >-
          The stock ledger (Lagerprotokoll) has NO read API at all — the single biggest gap
          (docs/05 #1). GET /v3/stockMovements is the ask. Until it ships the entity does not
          declare list/read at all, so a caller learns this from the contract instead of a 404.
      - field: unitCost
        ops: [read]
        reason: >-
          Movement valuation (unitCost at booking time) is required for GoBD-clean stock
          accounting (ADR-009e) — nothing upstream.
      - field: id
        ops: [create]
        reason: >-
          A booking returns no identity: the v1 storage-item endpoints answer 201 with an empty
          body and — contrary to their own spec — send no Location header (verified on mvp
          2026-07-31). Without an id a repeated booking cannot be recognised afterwards, which
          is why correction+setQuantityTo is the only retry-safe write. The ask: return the
          specced Location header, or the created movement.
  StockTake:
    label: Stock take
    reviewed: null
    operations: [list, read]
    statuses:
      status: [draft, counting, review, posted, cancelled]
    cannot:
      startCounting: >-
        v1 inventoryRuns is read-only — no state writes.
      submit: >-
        v1 inventoryRuns is read-only — no state writes.
      post: >-
        v1 inventoryRuns is read-only — no state writes.
      cancel: >-
        v1 inventoryRuns is read-only — no state writes.
      exportCountingList: >-
        Counting-list export is not exposed.
      recount: >-
        Recount has no public trigger.
      addPosition: >-
        Adding positions is not exposed via v1 inventoryRuns.
    fieldGaps:
      - field: positions
        ops: [read]
        reason: >-
          Counting positions (expected/counted/difference with values) live in the counting-list
          reports — not composed into the API payload yet; needed for the GoBD difference
          review.
      - field: id
        ops: [create]
        reason: >-
          Starting a stock take via API (scope: warehouse/locations/products, key date) — the v1
          inventory endpoints exist but the write orchestration is not built yet.
      - field: positions.counted
        ops: [update]
        reason: >-
          Submitting counted quantities via API (mobile counting) — needed for headless
          inventory.
      - field: documents.stockMovements
        ops: [read]
        reason: >-
          Posted correction movements per stock take need the stockMovements API (docs/05 #1) to
          be traceable.
      - field: dates.keyDate
        ops: [read]
        reason: >-
          The inventory key date (Stichtag) is not exposed by v1 inventoryRuns.
      - field: dates.posted
        ops: [read]
        reason: >-
          The posted timestamp is not exposed by v1 inventoryRuns.
      - field: totals
        ops: [read]
        reason: >-
          Position/difference totals are not exposed by v1 inventoryRuns.
  PickingRun:
    label: Picking run
    reviewed: null
    operations: [list, read]
    statuses:
      status: [draft, released, inProgress, picked, completed, cancelled]
    cannot:
      release: >-
        v1 pickLists is read-only — no state writes.
      start: >-
        v1 pickLists is read-only — no state writes.
      pause: >-
        v1 pickLists is read-only — no state writes.
      complete: >-
        v1 pickLists is read-only — no state writes.
      cancel: >-
        v1 pickLists is read-only — no state writes.
      assign: >-
        Picker assignment is not exposed.
      reprioritize: >-
        Priority changes are not exposed.
      printPickList: >-
        Pick-list print/PDF is not exposed.
    fieldGaps:
      - field: id
        ops: [create]
        reason: >-
          Creating a picking run by criteria (wave: channel, shipping method, cutoff, maxOrders)
          has NO upstream endpoint — the main gap (docs/05 #3); execution (start/complete,
          totes) already exists.
      - field: tasks
        ops: [read]
        reason: >-
          Task-level detail (location, product, quantity, status per pick) is not exposed on the
          pickLists API — needed for progress boards and pick-path optimisation.
      - field: tasks.status
        ops: [update]
        reason: >-
          Granular task-level pick confirmation with quantity + scans (docs/05 #3) — today only
          whole-list start/complete exists.
      - field: strategy
        ops: [create]
        reason: >-
          Choosing the picking strategy (single/multiOrder/wave/zone) at creation — no create
          endpoint today.
      - field: criteria
        ops: [read]
        reason: >-
          Pick-run criteria (channel, shipping method) are not exposed by v1 pickLists.
      - field: orders
        ops: [read]
        reason: >-
          The picked sales orders are not exposed by v1 pickLists (only counts).
      - field: containers
        ops: [read]
        reason: >-
          Totes/containers are not exposed by v1 pickLists.

masterdata:
  Customer:
    label: Customer
    reviewed: null
    operations: [list, read, create, update, delete]
    statuses:
      status: [active, archived]
      addresses.type: [billing, shipping, both]
      contacts.type: [mr, mrs, company, other]
    requiredForCreate: [name, contacts.name]
    filterable: [number, name, email, addresses.zip, addresses.city]
    notFilterable: [status]
    fields: [addresses.isDefault, contacts.salutation]
    can:
      addTag: {evidence: pass, params: [title]}
      removeTag: {evidence: pass, params: [title]}
    cannot:
      archive: >-
        No archive flag is writable via v3 customers.
      reactivate: >-
        No archive flag is writable via v3 customers.
      setHold: >-
        Customer holds (delivery/invoice block) are not writable via the public API.
      releaseHold: >-
        Customer holds are not writable via the public API.
      mergeInto: >-
        Duplicate merge is a UI-only feature — no API.
      runCreditCheck: >-
        Credit checks have no public trigger.
      statement: >-
        An open-items statement is not exposed via the public API.
    fieldGaps:
      - field: addresses.isDefault
        ops: [read, create, update]
        contested: [create, update]
        reason: >-
          Mark the standard address per type (unified-address model; at most one default per
          customer & type) — v3 partner addresses carry no isDefault flag.
      - field: addresses.label
        ops: [read, create, update]
        contested: [create, update]
        reason: >-
          Free label/name per address location (e.g. 'Lager München') — v3 knows only
          billing/shipping roles, no named locations.
      - field: addresses.type
        ops: [create, update]
        contested: [create, update]
        reason: >-
          Set the address role incl. the 'both' value (one address serving billing AND shipping)
          — v3 splits billing (primaryAddress/deviating) vs shipping (deliveryAddresses) by
          store, so the role is not a freely settable field.
      - field: contacts.address
        ops: [read, create, update]
        reason: >-
          Bind a contact person to a specific address (person-at-location) — v3 stores only a
          free-text contactPerson on delivery addresses, not a reference.
      - field: contacts.isPrimary
        ops: [read, create, update]
        reason: >-
          Mark the main contact person — v3 contactPersons carry no primary flag.
      - field: defaults.paymentTerms.dueDays
        ops: [create, update]
        reason: >-
          Default payment term for the customer — drives every order/invoice; must be settable.
      - field: defaults.taxation
        ops: [create, update]
        reason: >-
          Default taxation scheme (domestic/euB2B/euOss/export) per customer.
      - field: defaults.paymentMethod
        ops: [create, update]
        reason: >-
          Default payment method per customer.
      - field: finance.creditLimit
        ops: [update]
        reason: >-
          The customer credit limit — a core AR control; UI-only today, not writable via API
          (docs/05 #14).
      - field: finance.onHold
        ops: [update]
        reason: >-
          Put a customer on delivery/credit hold — UI-only today (docs/05 #14).
      - field: finance.dunningBlocked
        ops: [update]
        reason: >-
          Block dunning for a customer — UI-only today.
      - field: finance.openAmount
        ops: [read]
        reason: >-
          Aggregated open amount per customer is computed nowhere in the API (docs/05 #14) —
          must be derived/served.
      - field: customFields
        ops: [create, update]
        reason: >-
          Custom field values on the customer — today only readable, not writable via API.
      - field: status
        ops: [read, update]
        reason: >-
          Active/archived state is not exposed via v3 customers — needed for honest archiving
          (plan §6.1).
      - field: parent
        ops: [read, update]
        reason: >-
          B2B hierarchy (branch → HQ) is not exposed via the public API (plan §6.1 parent).
      - field: billTo
        ops: [read, update]
        reason: >-
          Central billing (Zentralregulierung — invoice to association/HQ) is not exposed (plan
          §6.1 billTo).
      - field: channels
        ops: [read]
        reason: >-
          Per-channel external ids (channel links) are not exposed via the public API.
      - field: defaults.shippingMethod
        ops: [read, update]
        reason: >-
          The default shipping method is not surfaced by the v3 partner read.
      - field: defaults.priceList
        ops: [read, update]
        reason: >-
          The assigned price list is not surfaced by the v3 partner read.
      - field: defaults.partialShipping
        ops: [read, update]
        reason: >-
          The partial-shipping preference is not surfaced by the v3 partner read.
      - field: type
        ops: [create, update]
        reason: >-
          Customer vs. lead (Interessent). v2 has isLead, but no v3 customers payload carries it
          — not in the record, not behind any allowed include — so the core cannot set it
          without leaving v3. Roughly half a typical CRM migration is leads, so they all land as
          customers today.
      - field: number
        ops: [update]
        reason: >-
          Correcting a customer number after the fact. v3 accepts a number on POST but not on
          PATCH, so a typo in a migrated number can only be fixed in the UI.
  Supplier:
