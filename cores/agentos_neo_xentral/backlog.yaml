# What the ERP cannot do, and why — the parked wish list.
#
# Every entry was written against a measured finding: an endpoint that does not exist, a
# field the upstream ignores, a transition that only happens in the UI. The core loads
# this file and renders each entry where it applies — on the action, or on the field —
# so a builder reads "not possible, and here is why" at the point of use instead of mere
# absence.
#
# It is NOT a specification. Nothing here says the system must do it; that statement now
# belongs in erp-spec.yaml and is made by a human, deliberately. This file only preserves
# the reasons, which took real investigation to establish and would otherwise be lost.
#
# Treat an entry as a hypothesis until a live probe has tried it. Measured on the first
# spec-driven run: of the entries that had never been probed, several were already false.

Quote:
  - field: customer
    ops: [update]
    reason: >-
      Reassign the quote's partner after creation — v3 accepts it only on create.
  - field: references.customerInquiryNumber
    ops: [create, update]
    reason: >-
      The customer's inquiry / RFQ number — B2B standard; read-only upstream today.
  - field: dates.validUntil
    ops: [create, update]
    reason: >-
      Offer validity date — drives auto-expiry and follow-up; must be settable per quote.
  - field: dates.requestedDelivery
    ops: [create, update]
    reason: >-
      Desired delivery date on the quote — not writable upstream today.
  - field: items.taxRate
    ops: [create, update]
    reason: >-
      Deviating tax rate per position. Upstream derives the line tax from the product's tax
      class and the customer's tax rule; v3 accepts taxRate on a line item, answers 2xx and
      keeps its own value — measured on mvp 2026-08-01 (sent "reduced", read back "standard", on
      create and on update alike). Needs a real write path upstream.
  - field: items.isOptional
    ops: [create, update]
    reason: >-
      Optional line items (not counted in totals) are a core quoting feature — not settable
      upstream today.
  - field: payment.method
    ops: [create, update]
    reason: >-
      Payment method proposed on the quote — frequently set per offer.
  - field: payment.terms.dueDays
    ops: [create, update]
    reason: >-
      Payment term proposed on the quote.
  - field: shipping.method
    ops: [create, update]
    reason: >-
      Shipping method proposed on the quote.
  - field: customFields
    ops: [create, update]
    reason: >-
      Custom field values on the quote — today only readable via include, not writable via API.
  - field: items.totals.tax
    ops: [read]
    reason: >-
      Tax amount per line. v3 states only taxRate and effectiveTaxRate on a line — no money
      figure — so the tax a position carries cannot be read. The core will not derive it from
      gross minus net: that is a number Xentral never stated, and line-level rounding against
      the legacy PDF (projekt.preisberechnung) is still an open decision, so a derived value
      could silently disagree with the printed document. Per-rate tax exists on the document
      totals; the line needs its own.

SalesOrder:
  - field: number
    ops: [update]
    reason: >-
      Correcting a sales order number after the fact. The v3 create accepts one, but PATCH has
      no slot for it — a number carried over from another system must be right the first time.
  - field: customer
    ops: [update]
    reason: >-
      Reassign the order to the correct customer after creation — v3 accepts the partner only on
      create today.
  - field: references.customerOrderNumber
    ops: [create]
    reason: >-
      The customer's own order / PO number (B2B standard field). Read-only upstream today; a
      clerk must be able to set and correct it.
  - field: references.externalId
    ops: [search]
    reason: >-
      Automated reconciliation matches by the external id.
  - field: dates.requestedDelivery
    ops: [update]
    reason: >-
      Desired delivery date — core fulfilment field; one of the first things entered on an
      order. Not writable upstream today.
  - field: items.taxRate
    ops: [create, update]
    reason: >-
      Deviating tax rate per position. Upstream derives the line tax from the product's tax
      class and the customer's tax rule; v3 accepts taxRate on a line item, answers 2xx and
      keeps its own value — measured on mvp 2026-08-01 (sent "reduced", read back "standard", on
      create and on update alike). Needs a real write path upstream.
  - field: shipping.method
    ops: [create, update]
    reason: >-
      Carrier / shipping method — core to fulfilment; must be selectable per order.
  - field: fulfillmentPolicy.partialShipping
    ops: [create, update]
    reason: >-
      Partial-shipping policy has no upstream slot — the read reports a hardcoded "allowed".
      Needs a real v3 field before it can be written or trusted.
  - field: discounts
    ops: [read]
    reason: >-
      Header discounts/vouchers (e-commerce) are not exposed by v3 salesOrders — only line-level
      discounts exist.
  - field: customFields
    ops: [create, update]
    reason: >-
      Custom field values carry company-specific data — today only readable via include, not
      writable via API (all documents).
  - field: customFields
    ops: [filter]
    reason: >-
      Companies segment and find orders by their own custom-field values.
  - field: items.totals.tax
    ops: [read]
    reason: >-
      Tax amount per line. v3 states only taxRate and effectiveTaxRate on a line — no money
      figure — so the tax a position carries cannot be read. The core will not derive it from
      gross minus net: that is a number Xentral never stated, and line-level rounding against
      the legacy PDF (projekt.preisberechnung) is still an open decision, so a derived value
      could silently disagree with the printed document. Per-rate tax exists on the document
      totals; the line needs its own.

DeliveryNote:
  - field: customer
    ops: [update]
    reason: >-
      Reassign the delivery note's partner after creation — v3 accepts it only on create.
  - field: warehouse
    ops: [create, update]
    reason: >-
      The picking/shipping warehouse — must be selectable per delivery note, not fixed to the
      default.
  - field: items
    ops: [update]
    reason: >-
      Adjust delivered positions/quantities after creation — the v3 update DTO carries no
      line-item write path.
  - field: shipments
    ops: [read]
    reason: >-
      Tracking numbers need a nachlade GET /v1/deliveryNotes/{id}/shipments — not yet composed
      into the read payload.
  - field: customs.totalWeight
    ops: [create, update]
    reason: >-
      Total shipment weight for the customs declaration / carrier — needs to be settable.
  - field: customs.incoterm
    ops: [create, update]
    reason: >-
      Incoterm for export shipments — a customs-declaration essential, not settable via API
      today.
  - field: customs.note
    ops: [create, update]
    reason: >-
      Customs note for export paperwork.
  - field: customFields
    ops: [create, update]
    reason: >-
      Custom field values on the delivery note — today only readable via include, not writable
      via API.

Shipment:
  - field: id
    ops: [create]
    reason: >-
      Creating a shipment + label via the facade (POST /v1/shipments + createLabel exists
      upstream) is not orchestrated here yet — needed for headless fulfilment.
  - field: status
    ops: [read]
    reason: >-
      The shipment lifecycle status is not exposed by v1 shipments — only sentAt exists.
  - field: weight
    ops: [read]
    reason: >-
      Package weight is not exposed by v1 shipments.
  - field: events
    ops: [read]
    reason: >-
      Carrier tracking events are not exposed — needs a carrier-events feed.
  - field: tracking.number
    ops: [search]
    reason: >-
      Support looks up a shipment by tracking number — needs a filterable/searchable upstream
      list parameter.

SalesInvoice:
  - field: number
    ops: [update]
    reason: >-
      Correcting a invoice number after the fact. The v3 create accepts one, but PATCH has no
      slot for it — a number carried over from another system must be right the first time.
  - field: customer
    ops: [update]
    reason: >-
      Reassign the invoice's partner after creation — v3 accepts it only on create.
  - field: references.debtorAccountNumber
    ops: [create, update]
    reason: >-
      Deviating debtor account for the FiBu/DATEV export — settable when it differs from the
      customer default.
  - field: items.taxRate
    ops: [create, update]
    reason: >-
      Deviating tax rate per position. Upstream derives the line tax from the product's tax
      class and the customer's tax rule; v3 accepts taxRate on a line item, answers 2xx and
      keeps its own value — measured on mvp 2026-08-01 (sent "reduced", read back "standard", on
      create and on update alike). Needs a real write path upstream.
  - field: totals.outstanding
    ops: [read]
    reason: >-
      Exact open amount needs readable payment↔invoice allocations (docs/05 #2); today only
      derived from paymentStatus.
  - field: payment.method
    ops: [create, update]
    reason: >-
      Payment method on the invoice — central to order-to-cash; frequently overridden.
  - field: payment.terms.dueDays
    ops: [create, update]
    reason: >-
      Net payment term in days — drives the due date and dunning.
  - field: payment.terms.discountPercent
    ops: [create, update]
    reason: >-
      Cash-discount percentage — standard DACH B2B.
  - field: payment.terms.discountDays
    ops: [create, update]
    reason: >-
      Cash-discount period in days — pairs with the discount.
  - field: eInvoice
    ops: [read]
    reason: >-
      The finished ZUGFeRD/XRechnung artefact + delivery status is a missing upstream API
      (docs/05 #7) — only XML raw data exists today.
  - field: customFields
    ops: [create, update]
    reason: >-
      Custom field values on the invoice — today only readable via include, not writable via
      API.
  - field: items.totals.tax
    ops: [read]
    reason: >-
      Tax amount per line. v3 states only taxRate and effectiveTaxRate on a line — no money
      figure — so the tax a position carries cannot be read. The core will not derive it from
      gross minus net: that is a number Xentral never stated, and line-level rounding against
      the legacy PDF (projekt.preisberechnung) is still an open decision, so a derived value
      could silently disagree with the printed document. Per-rate tax exists on the document
      totals; the line needs its own.

Payment:
  - field: id
    ops: [list]
    reason: >-
      No payment LIST/filter exists upstream — only GET /paymentTransactions/{id} (docs/05 #2).
      GET /v3/payments with filters is the ask.
  - field: kind
    ops: [read]
    reason: >-
      Payout/settlement aggregation (fees, chargebacks) per provider needs docs/05 #8.
  - field: allocations
    ops: [read, update]
    reason: >-
      Payment↔invoice allocations (n:m) are neither readable nor writable — without them exact
      outstanding amounts are impossible (docs/05 #2).

Return:
  - field: customer
    ops: [update]
    reason: >-
      Reassign the partner after creation — v3 accepts it only on create.
  - field: references.rmaNumber
    ops: [create, update]
    reason: >-
      The RMA number the customer quotes — no upstream field today; core to returns handling.
  - field: references.rmaNumber
    ops: [search]
    reason: >-
      Support finds a return by the RMA number the customer has.
  - field: warehouse
    ops: [create, update]
    reason: >-
      The returns warehouse must be selectable per return.
  - field: items
    ops: [update]
    reason: >-
      Edit return positions after creation — the v3 update DTO carries no line-item write path.
  - field: items.reason
    ops: [create, update]
    reason: >-
      The return reason per line — essential for returns analytics; not settable via API today.
  - field: items.condition
    ops: [create, update]
    reason: >-
      Item condition (resellable/damaged/disposal) drives restocking — not in the v3 payload
      yet.
  - field: items.condition
    ops: [read]
    reason: >-
      Item condition is not surfaced by the v3 return payload yet (docs/05 #4 batch/trace
      family).
  - field: items.action
    ops: [create, update]
    reason: >-
      Resolution per line (credit/replace/repair) — not in the v3 payload yet.
  - field: customFields
    ops: [create, update]
    reason: >-
      Custom field values on the return — today only readable via include, not writable via API.

CreditNote:
  - field: number
    ops: [update]
    reason: >-
      Correcting a credit note number after the fact. The v3 create accepts one, but PATCH has
      no slot for it — a number carried over from another system must be right the first time.
  - field: customer
    ops: [update]
    reason: >-
      Reassign the partner after creation — v3 accepts it only on create.
  - field: references.debtorAccountNumber
    ops: [create, update]
    reason: >-
      Deviating debtor account for the FiBu/DATEV export of the credit note.
  - field: dates.serviceDate
    ops: [create, update]
    reason: >-
      Leistungsdatum — a §14 UStG mandatory field on the credit note; must be settable.
  - field: items.taxRate
    ops: [create, update]
    reason: >-
      Deviating tax rate per position. Upstream derives the line tax from the product's tax
      class and the customer's tax rule; v3 accepts taxRate on a line item, answers 2xx and
      keeps its own value — measured on mvp 2026-08-01 (sent "reduced", read back "standard", on
      create and on update alike). Needs a real write path upstream.
  - field: totals.outstanding
    ops: [read]
    reason: >-
      Exact open amount needs readable refund/offset allocations (docs/05 #2); today derived
      from paymentStatus only.
  - field: settlement.mode
    ops: [create, update]
    reason: >-
      Refund vs offset-against-invoice is a per-credit-note decision — not settable upstream
      today.
  - field: customFields
    ops: [create, update]
    reason: >-
      Custom field values on the credit note — today only readable via include, not writable via
      API.
  - field: items.totals.tax
    ops: [read]
    reason: >-
      Tax amount per line. v3 states only taxRate and effectiveTaxRate on a line — no money
      figure — so the tax a position carries cannot be read. The core will not derive it from
      gross minus net: that is a number Xentral never stated, and line-level rounding against
      the legacy PDF (projekt.preisberechnung) is still an open decision, so a derived value
      could silently disagree with the printed document. Per-rate tax exists on the document
      totals; the line needs its own.

PurchaseOrder:
  - field: supplier
    ops: [update]
    reason: >-
      Reassign the PO's supplier after creation — v3 accepts it only on create.
  - field: references.ourCustomerNumber
    ops: [create, update]
    reason: >-
      Our customer number at the supplier — belongs on the PO, not settable via API today.
  - field: references.supplierOfferNumber
    ops: [create, update]
    reason: >-
      The supplier's quote number we ordered against — read-only upstream today.
  - field: confirmation.status
    ops: [update]
    reason: >-
      Recording the confirmation status (pending/confirmed/deviating) is core purchasing — not
      writable via API today.
  - field: confirmation.supplierOrderNumber
    ops: [update]
    reason: >-
      The AB (order-confirmation) number from the supplier — the whole confirmation block is
      read-only upstream (docs/05: AB handling).
  - field: dates.requestedDelivery
    ops: [create, update]
    reason: >-
      Requested delivery date at the supplier — not writable upstream today.
  - field: warehouse
    ops: [create, update]
    reason: >-
      The receiving warehouse for the PO must be selectable.
  - field: items
    ops: [update]
    reason: >-
      Edit PO positions after creation — the v3 update DTO carries no line-item write path.
  - field: items.taxRate
    ops: [create, update]
    reason: >-
      Deviating tax rate per position. Upstream derives the line tax from the product's tax
      class and the customer's tax rule; v3 accepts taxRate on a line item, answers 2xx and
      keeps its own value — measured on mvp 2026-08-01 (sent "reduced", read back "standard", on
      create and on update alike). Needs a real write path upstream.
  - field: dropship
    ops: [read, create]
    reason: >-
      Dropshipping (Strecke: salesOrder link + customer delivery address) is not exposed via v3
      purchaseOrders.
  - field: customFields
    ops: [create, update]
    reason: >-
      Custom field values on the PO — today only readable via include, not writable via API.

GoodsReceipt:
  - field: references.supplierDeliveryNoteNumber
    ops: [create, update, read]
    reason: >-
      The supplier's delivery-note number on the goods receipt — needed for the three-way match;
      not in the BF record yet.
  - field: dates.received
    ops: [read]
    reason: >-
      Received/posted dates are not exposed — only createdAt/updatedAt exist on the BF entity.
  - field: dates.posted
    ops: [read]
    reason: >-
      Received/posted dates are not exposed — only createdAt/updatedAt exist on the BF entity.
  - field: status
    ops: [update]
    reason: >-
      Cancel/storno of a posted goods receipt — the remaining upstream gap after the BF entity
      list covered browsing (docs/05 #9 revised).
  - field: items
    ops: [read, create, update]
    reason: >-
      Line items (product × quantity × storage location, quality check per line) are not exposed
      on the BF goodsReceipt record — creation still goes through the PO action only.

PurchaseInvoice:
  - field: number
    ops: [update]
    reason: >-
      The document number is system-assigned: sending `documentNumber` on create answers 201 and
      the record comes back with an empty number (measured on mvp 2026-08-02). Same behaviour as
      the other documents.
  - field: status
    ops: [filter]
    reason: >-
      Filtering incoming invoices by workflow status is the AP daily view — the BF
      supplierInvoice API does not allow filtering documentStatus today.
  - field: dates.invoiceDate
    ops: [sort]
    reason: >-
      Sorting incoming invoices by invoice date — dateOfSupplierInvoice is not sortable on the
      BF API today.
  - field: match.status
    ops: [update]
    reason: >-
      Re-running/overriding the match verdict via API (rematch) — the check statuses are
      readable now; a command to re-evaluate is still missing upstream.
  - field: payment.status
    ops: [filter]
    reason: >-
      Open-liabilities view needs filtering by payment status — not allowed on the BF
      supplierInvoice API today.
  - field: approval.status
    ops: [update]
    reason: >-
      Approve/reject via API: BF process steps (GoodsCheck/InvoiceCheck/Payment) are reported to
      exist — wiring + live verification of those steps is pending (steps were empty on the test
      instance's metadata).
  - field: approval.by
    ops: [read]
    reason: >-
      The approver is not exposed — BF supplierInvoice carries only the check statuses.
  - field: approval.at
    ops: [read]
    reason: >-
      The approval timestamp is not exposed by the BF supplierInvoice entity.

StockMovement:
  - field: id
    ops: [list, read]
    reason: >-
      The stock ledger (Lagerprotokoll) has NO read API at all — the single biggest gap (docs/05
      #1). GET /v3/stockMovements is the ask. Until it ships the entity does not declare
      list/read at all, so a caller learns this from the contract instead of a 404.
  - field: id
    ops: [create]
    reason: >-
      A booking returns no identity: the v1 storage-item endpoints answer 201 with an empty body
      and — contrary to their own spec — send no Location header (verified on mvp 2026-07-31).
      Without an id a repeated booking cannot be recognised afterwards, which is why
      correction+setQuantityTo is the only retry-safe write. The ask: return the specced
      Location header, or the created movement.
  - field: unitCost
    ops: [read]
    reason: >-
      Movement valuation (unitCost at booking time) is required for GoBD-clean stock accounting
      (ADR-009e) — nothing upstream.

StockTake:
  - field: id
    ops: [create]
    reason: >-
      Starting a stock take via API (scope: warehouse/locations/products, key date) — the v1
      inventory endpoints exist but the write orchestration is not built yet.
  - field: dates.keyDate
    ops: [read]
    reason: >-
      The inventory key date (Stichtag) is not exposed by v1 inventoryRuns.
  - field: dates.posted
    ops: [read]
    reason: >-
      The posted timestamp is not exposed by v1 inventoryRuns.
  - field: positions
    ops: [read]
    reason: >-
      Counting positions (expected/counted/difference with values) live in the counting-list
      reports — not composed into the API payload yet; needed for the GoBD difference review.
  - field: positions.counted
    ops: [update]
    reason: >-
      Submitting counted quantities via API (mobile counting) — needed for headless inventory.
  - field: documents.stockMovements
    ops: [read]
    reason: >-
      Posted correction movements per stock take need the stockMovements API (docs/05 #1) to be
      traceable.

PickingRun:
  - field: id
    ops: [create]
    reason: >-
      Creating a picking run by criteria (wave: channel, shipping method, cutoff, maxOrders) has
      NO upstream endpoint — the main gap (docs/05 #3); execution (start/complete, totes)
      already exists.
  - field: criteria
    ops: [read]
    reason: >-
      Pick-run criteria (channel, shipping method) are not exposed by v1 pickLists.
  - field: orders
    ops: [read]
    reason: >-
      The picked sales orders are not exposed by v1 pickLists (only counts).
  - field: containers
    ops: [read]
    reason: >-
      Totes/containers are not exposed by v1 pickLists.
  - field: strategy
    ops: [create]
    reason: >-
      Choosing the picking strategy (single/multiOrder/wave/zone) at creation — no create
      endpoint today.
  - field: tasks
    ops: [read]
    reason: >-
      Task-level detail (location, product, quantity, status per pick) is not exposed on the
      pickLists API — needed for progress boards and pick-path optimisation.
  - field: tasks.status
    ops: [update]
    reason: >-
      Granular task-level pick confirmation with quantity + scans (docs/05 #3) — today only
      whole-list start/complete exists.

Customer:
  - field: number
    ops: [update]
    reason: >-
      Correcting a customer number after the fact. v3 accepts a number on POST but not on PATCH,
      so a typo in a migrated number can only be fixed in the UI.
  - field: defaults.paymentMethod
    ops: [create, update]
    reason: >-
      Default payment method per customer.
  - field: defaults.paymentTerms.dueDays
    ops: [create, update]
    reason: >-
      Default payment term for the customer — drives every order/invoice; must be settable.
  - field: defaults.shippingMethod
    ops: [update]
    reason: >-
      The default shipping method is not surfaced by the v3 partner read.
  - field: finance.creditLimit
    ops: [update]
    reason: >-
      The customer credit limit — a core AR control; UI-only today, not writable via API
      (docs/05 #14).
  - field: finance.onHold
    ops: [update]
    reason: >-
      Put a customer on delivery/credit hold — UI-only today (docs/05 #14).
  - field: customFields
    ops: [create, update]
    reason: >-
      Custom field values on the customer — today only readable, not writable via API.
Supplier:
  - field: defaults.shippingMethod
    ops: [update]
    reason: >-
      The default shipping method is not surfaced by the v3 partner read.
  - field: defaults.paymentTerms.dueDays
    ops: [create, update]
    reason: >-
      Default supplier payment term — drives liability due dates.
  - field: finance.creditorAccountNumber
    ops: [update]
    reason: >-
      The creditor account for the FiBu/DATEV export — settable per supplier.
  - field: customFields
    ops: [create, update]
    reason: >-
      Custom field values on the supplier — today only readable, not writable via API.
Product:
  - field: kind
    ops: [create, update]
    reason: >-
      The consolidated product kind (ADR-011) should be settable directly instead of juggling
      isServiceProduct/isFee/isShippingCostsProduct booleans — the v2 create body only exposes
      isShippingCostsProduct, so service/digital cannot be expressed.
  - field: tags
    ops: [create, update]
    reason: >-
      Tagging products (assortment curation, campaigns) — product writes now go through v2, but
      the v2 tags shape ({id,key,name,color}) is not yet mapped/verified, so tag writes stay
      blue.
  - field: prices.sale
    ops: [read]
    reason: >-
      WRITE works — the sale price is composed as a separate salesPrices write on create/update.
      READ is still blue: the v3 read model does not carry the sale price (needs the salesPrices
      include parsed), so a written price is not read back.
  - field: tax.profile
    ops: [create, update]
    reason: >-
      The 16-account tax matrix consolidated into a referenceable taxProfile (ADR-011) — today
      only the raw taxAccounts embed exists, not a clean reference.
  - field: logistics.packagingUnits
    ops: [create, read, update]
    reason: >-
      Packaging units (VPE) need the packagingUnits include parsed — not yet mapped.
  - field: stock.incoming
    ops: [read]
    reason: >-
      Inbound quantity (ordered but not yet received) is the one stock figure Xentral does not
      compute: /products/{id}/stocks returns physical, sellable, reserved, correction, pseudo,
      openSalesOrders, calculated and producible — all mapped — but nothing inbound. The
      per-warehouse split the same call carries is answered by StockLevel (filter[product],
      narrowed by warehouse), so it is not duplicated onto the product.
  - field: suppliers
    ops: [create, update]
    reason: >-
      The default supplier IS writable (mapped to v2 standardSupplier); multi-supplier sourcing
      (several suppliers with per-supplier price/number) needs a suppliers include/relation not
      yet mapped, plus a write path.

PriceList:
  - field: entries
    ops: [read]
    reason: >-
      v1 salesPrices exposes flat price rows (this entity is one row); the grouped priceList
      with a tier array needs a composer (ADR-012). Write each tier as its own entry
      (create/update/delete are live via v3/v1 salesPrices).

StorageLocation:
  - field: description
    ops: [create, update]
    reason: >-
      Upstream returns the bin description but rejects it on create and update ("The attribute
      description is not allowed.") — the field is read-only for every API generation we have.
      Measured on mvp 2026-08-02.
  - field: contents.reserved
    ops: [read]
    reason: >-
      Location contents are composed from the StockLevel projection now; the reserved portion
      per location stays unavailable — upstream reports reservations only as a product total.
  - field: locationType
    ops: [read]
    reason: >-
      v1 accepts a `locationType` on write with 204 but never returns it on any read, so a value
      written there cannot be verified or shown. Not modelled until upstream reads it back.
      Measured on mvp 2026-08-02.

StockLevel:
  - field: batch
    ops: [read, list]
    reason: >-
      The batch split exists on the v2 items path (qualityControlAttributes) but not on
      /v1/products/{id}/storageLocations. Emitting batch rows on one anchor only would make the
      grain depend on the filter, so the projection stays product × storage location. A unified
      GET /v3/stockLevels is the clean ask (docs/05 #18).
  - field: quantity
    ops: [list]
    reason: >-
      The list needs an anchor filter (product or storageLocation): upstream has no global stock
      collection, so an unanchored query would mean fanning out over every product of the
      tenant.
  - field: reserved
    ops: [read]
    reason: >-
      No per-location reservation is exposed upstream; /v1/products/{id}/stocks reports reserved
      only as a product TOTAL. The projection reports quantity and leaves reserved/available
      blank rather than spreading a total over locations.
  - field: available
    ops: [read]
    reason: >-
      Same gap as reserved: available = quantity - reserved is only derivable per product, not
      per storage location.

Batch:
  - field: id
    ops: [list, read]
    reason: >-
      Batches exist only as read-only v3 Product includes — no batch resource, no list, no
      detail (docs/05 #4). GET /v3/batches is the ask.
  - field: bestBefore
    ops: [update]
    reason: >-
      Correcting a best-before date via API — internal web routes only today.
  - field: status
    ops: [update]
    reason: >-
      Blocking/releasing a batch (quality hold) via API — maintenance happens only through
      internal web routes today.
  - field: trace
    ops: [read]
    reason: >-
      Batch trace (which goods receipts brought it in, which delivery notes shipped it — recall
      scenario) has no API at all (docs/05 #4).

Channel:
  - field: platform
    ops: [read]
    reason: >-
      The platform kind (shopify/amazon/…) is not exposed — the BF salesChannel entity carries
      only a name (05 #17).
  - field: name
    ops: [create, update]
    reason: >-
      REVISED (docs/05 #17): BF salesChannel has CRUD — our facade write-mapping + live
      verification is pending.
  - field: type
    ops: [read, create, update]
    reason: >-
      The channel type (shop/marketplace/direct/pos) is not on the BF salesChannel record —
      needed for channel-specific routing.
Task:
  - field: assignee
    ops: [create, update]
    reason: >-
      The one thing that would make a task a work item. `assignee` is readOnly upstream: a
      create or update carrying it answers 2xx and leaves the field null. Measured on mvp
      2026-08-02.
  - field: dates.completed
    ops: [update]
    reason: >-
      Completing a task through the API does not stamp its completion date: `status: completed`
      persists, `completionDate` stays null.
  - field: timeline
    ops: [read]
    reason: >-
      The task's comment thread. Declared `readWrite` with a full sub-node and returned by NO
      read — not the list, not the single read, and no include/expand parameter produces it. Not
      modelled until it reads back.
