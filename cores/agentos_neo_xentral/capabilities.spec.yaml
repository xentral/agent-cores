# Executable, but never actually proven against a live tenant. Measured on the
# instance named in verified.json: of 80 capabilities claimed executable, 25 are
# `pass` (effect read back); the rest are `reachable` (the route exists and
# refused our probe — no capability claim either way), `executed` (changed
# something, nobody looked) or never tested at all.
evidenceGaps:
  CreditNote: [release, removeWriteProtection, send, setWriteProtection]
  DeliveryNote: [cancel, createReturn, createSalesInvoice, markDelivered, release, removeWriteProtection, setWriteProtection]
  EmailAccount: [sendEmail]
  Printer: [printDocument]
  Product: [activate, deactivate]
  PurchaseOrder: [cancel, close, createGoodsReceipt, release, removeWriteProtection, send, setWriteProtection]
  Quote: [cancel, release, removeWriteProtection, send, setWriteProtection]
  Return: [cancel, createCreditNote, createFromDeliveryNote, release, removeWriteProtection, restock, setWriteProtection, settle]
  SalesInvoice: [cancel, release, removeWriteProtection, send, setWriteProtection]
  SalesOrder: [cancel, close, createSalesInvoice, dispatch, release, removeWriteProtection, sendConfirmation, setWriteProtection, split, splitOrder]
  StorageLocation: [inventoryCount, putaway, stockAdjustment, stockRemoval, stockTransfer]

