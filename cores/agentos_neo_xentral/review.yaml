    - field: batch
      ops:
      - read
      status: open
      reason: 'A booking can name a batch, but the ledger does not report which one
        the posting hit — so a batch''s movement history is not reconstructable from
        it (docs/05 #4).'
    - field: id
      ops:
      - create
      status: open
      reason: 'A booking returns no identity: the v1 storage-item endpoints answer
        201 with an empty body and — contrary to their own spec — send no Location
        header (verified on mvp 2026-07-31). Without an id a repeated booking cannot
        be recognised afterwards, which is why correction+setQuantityTo is the only
        retry-safe write. The ask: return the specced Location header, or the created
        movement.'
    - field: unitCost
      ops:
      - read
      status: recheck
      reason: Movement valuation (unitCost at booking time) is required for GoBD-clean
        stock accounting (ADR-009e) — nothing upstream.
      nowProven:
      - read
