name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: JSON is well-formed
        run: python3 -c "import json; json.load(open('manifest.json'))"

      - name: Structure + manifest consistency
        run: python3 scripts/validate_cores.py

      - name: Lint cores (ruff)
        run: |
          pip install ruff
          # No cores yet is fine — ruff on an empty tree is a no-op.
          ruff check cores/ || exit 1

      - name: Secret scan (no secrets / no tenant data)
        run: |
          VER=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --no-git --redact --exit-code 1

  # Import-smoke: every core loads against the LIVE backend contract
  # (entity_registry.core_sdk). Since agent-os is private, this checks it out
  # with a read-only deploy key (`AGENT_OS_READ_KEY` secret) and imports the
  # registry over this repo's cores/. The key is REQUIRED: a missing key fails the
  # job rather than skipping it, so "green" always means the contract was checked.
  import-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Require the agent-os deploy key
        env:
          KEY: ${{ secrets.AGENT_OS_READ_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::AGENT_OS_READ_KEY is not set — import-smoke cannot validate cores against the agent-os contract. Add a read-only deploy key for xentral/agent-os as this repo's AGENT_OS_READ_KEY secret."
            exit 1
          fi

      - name: Checkout agent-cores
        uses: actions/checkout@v4

      - name: Checkout agent-os (backend contract)
        uses: actions/checkout@v4
        with:
          repository: xentral/agent-os
          ref: main
          ssh-key: ${{ secrets.AGENT_OS_READ_KEY }}
          path: _agent-os

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install backend deps
        working-directory: _agent-os/backend
        run: uv sync

      - name: Import-smoke + core adapter tests
        working-directory: _agent-os/backend
        env:
          # registry discovery reads cores from THIS repo's cores/; backend on PYTHONPATH.
          XENTRAL_CORES_ROOT: ${{ github.workspace }}/cores
          PYTHONPATH: .
        run: uv run pytest -q "${{ github.workspace }}/tests/"
